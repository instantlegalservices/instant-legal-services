const params=new URLSearchParams(location.search),slug=params.get("service")||"";
const langSelect=document.getElementById("language");
function render(lang){
 const d=content[lang]||content["en-IN"],item=d[slug]||d["legal-drafting"];
 document.documentElement.lang=lang==="hinglish"?"en-IN":lang;document.documentElement.dir=lang==="ur-IN"?"rtl":"ltr";
 document.getElementById("language").value=lang;

 document.getElementById("title").textContent=item.title;
 document.getElementById("intro").textContent=item.intro;

 document.getElementById("footer").textContent=d.footer;

 const actions=document.getElementById("actions");
 actions.innerHTML='<a class="primary" href="'+item.cta+'">'+item.ctaText+'</a>'+(slug==="traffic-challan"?'<a class="secondary" href="https://echallan.parivahan.nic.in/login" target="_blank" rel="noopener">'+d.official+'</a>':"")+'<a class="secondary" href="/">Home</a>';
 try{localStorage.setItem("ils-home-lang",lang)}catch(e){}
}
const saved=localStorage.getItem("ils-home-lang")||"en-IN";
langSelect.value=saved;render(saved);
langSelect.addEventListener("change",e=>render(e.target.value));
})();
