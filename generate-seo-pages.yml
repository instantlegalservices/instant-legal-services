name: Generate Dynamic SEO Pages
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate SEO pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://instantlegalservices.in
        run: node scripts/generate-seo-pages.js
      - name: Commit generated files
        run: |
          git config user.name "ILS SEO Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add seo sitemap.xml
          git diff --cached --quiet || git commit -m "Auto-update approved public advocate SEO pages"
          git push
