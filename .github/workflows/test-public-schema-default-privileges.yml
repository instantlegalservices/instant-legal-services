name: Public Schema Default Privilege Hardening

on:
  pull_request:
    paths:
      - "supabase/migrations/20261117190000_harden_public_schema_default_privileges.sql"
      - "scripts/test-public-schema-default-privileges.js"
      - ".github/workflows/test-public-schema-default-privileges.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify public schema default privilege hardening
        run: node scripts/test-public-schema-default-privileges.js
