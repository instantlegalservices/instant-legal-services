name: Smart Challan Browser Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ils-smart-challan-finder-main-sync
    paths:
      - "government/echallan/smart-check.html"
      - ".github/workflows/test-smart-challan-browser.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pdfjs-dist@3.11.174 pdf-lib@1.17.1
          npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ils-http.log 2>&1 &
          echo $! > /tmp/ils-http.pid
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/government/echallan/smart-check.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ils-http.log
          exit 1

      - name: Run isolated browser and synthetic PDF checks
        env:
          BASE_URL: http://127.0.0.1:4173/government/echallan/smart-check.html
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const { PDFDocument, StandardFonts } = require('pdf-lib');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'block',
              reducedMotion: 'reduce'
            });
            const page = await context.newPage();
            const failures = [];
            page.on('pageerror', error => failures.push(error.message));

            // All network requests are blocked except the exact pinned PDF.js
            // assets, which are served from the installed local package.
            await page.route('https://**/*', async route => {
              const url = new URL(route.request().url());
              if (url.pathname.endsWith('/pdf.min.js')) {
                return route.fulfill({
                  status: 200,
                  contentType: 'application/javascript',
                  body: fs.readFileSync('node_modules/pdfjs-dist/build/pdf.min.js')
                });
              }
              if (url.pathname.endsWith('/pdf.worker.min.js')) {
                return route.fulfill({
                  status: 200,
                  contentType: 'application/javascript',
                  body: fs.readFileSync('node_modules/pdfjs-dist/build/pdf.worker.min.js')
                });
              }
              return route.abort();
            });

            try {
              await page.goto(process.env.BASE_URL, { waitUntil: 'domcontentloaded' });
              if (!(await page.locator('#vehicle').isVisible())) throw new Error('Vehicle input is not visible');
              if (!(await page.locator('#pdfFile').isVisible())) throw new Error('PDF input is not visible');
              if (await page.locator('meta[name="robots"]').getAttribute('content') !== 'noindex,follow') {
                throw new Error('Tool page should remain noindex,follow');
              }

              await page.locator('#openPortal').click();
              if (!(await page.locator('#vehicleStatus').innerText()).includes('पहले वाहन नंबर दर्ज करें')) {
                throw new Error('Empty vehicle number validation did not appear');
              }

              await page.locator('#vehicle').fill('up 25-ab 1234');
              await page.locator('#openPortal').click();
              if (await page.locator('#vehicle').inputValue() !== 'UP25AB1234') {
                throw new Error('Vehicle number normalization failed');
              }
              if (!(await page.locator('#vehicleStatus').innerText()).includes('आधिकारिक eChallan पोर्टल')) {
                throw new Error('Portal guidance status did not appear');
              }

              await page.locator('#readPdf').click();
              if (!(await page.locator('#pdfStatus').innerText()).includes('पहले चालान PDF चुनें')) {
                throw new Error('Missing-PDF validation did not appear');
              }

              // Generate a synthetic PDF fixture locally. It contains no real
              // person's or vehicle's data and is never sent to a remote service.
              const pdf = await PDFDocument.create();
              const pdfPage = pdf.addPage([595, 842]);
              const font = await pdf.embedFont(StandardFonts.Helvetica);
              const lines = [
                'Challan Number: CH-TEST-12345',
                'Vehicle Number: UP25AB1234',
                'Challan Date: 2026-10-01',
                'Challan Amount: INR 1000',
                'Violation Details: Signal Jumping',
                'Challan Place: Bareilly'
              ];
              lines.forEach((line, index) => {
                pdfPage.drawText(line, { x: 48, y: 760 - index * 34, size: 12, font });
              });
              const pdfBytes = Buffer.from(await pdf.save());
              await page.locator('#pdfFile').setInputFiles({
                name: 'synthetic-challan-test.pdf',
                mimeType: 'application/pdf',
                buffer: pdfBytes
              });
              await page.locator('#readPdf').click();
              await page.locator('#results.show').waitFor({ state: 'visible', timeout: 10000 });

              const extracted = await page.locator('#rawText').innerText();
              for (const expected of ['CH-TEST-12345', 'UP25AB1234', '2026-10-01', 'INR 1000', 'Signal Jumping', 'Bareilly']) {
                if (!extracted.includes(expected)) throw new Error('Extracted PDF text missing: ' + expected);
              }
              const resultText = await page.locator('#fields').innerText();
              if (!resultText.includes('CH-TEST-12345')) throw new Error('Challan number field not populated');
              if (!resultText.includes('UP25AB1234')) throw new Error('Vehicle number field not populated');
              if (!resultText.includes('2026-10-01')) throw new Error('Challan date field not populated');
              if (!resultText.includes('1000')) throw new Error('Challan amount field not populated');
              if (!resultText.includes('Signal Jumping')) throw new Error('Violation field not populated');
              if (!resultText.includes('Bareilly')) throw new Error('Challan place field not populated');

              // Exercise fallback layouts without a labelled place or amount.
              const fallbackPdf = await PDFDocument.create();
              const fallbackPage = fallbackPdf.addPage([595, 842]);
              const fallbackFont = await fallbackPdf.embedFont(StandardFonts.Helvetica);
              const fallbackLines = [
                'Challan Number: CH-TEST-67890',
                'Vehicle Number: UP25XY6789',
                'Time: 13:07:01',
                'Delapeer, Izatnagar, Bareilly, Uttar Pradesh',
                '6000/-',
                '1: Driving licence not produced',
                '2: Defective number plate',
                '3: Pollution certificate not produced'
              ];
              fallbackLines.forEach((line, index) => {
                fallbackPage.drawText(line, { x: 48, y: 760 - index * 30, size: 12, font: fallbackFont });
              });
              await page.locator('#pdfFile').setInputFiles({
                name: 'synthetic-unlabelled-place-test.pdf',
                mimeType: 'application/pdf',
                buffer: Buffer.from(await fallbackPdf.save())
              });
              await page.locator('#readPdf').click();
              await page.locator('#results.show').waitFor({ state: 'visible', timeout: 10000 });
              const fallbackFields = await page.locator('#fields').innerText();
              if (!fallbackFields.includes('6000/-')) throw new Error('Unlabelled challan amount fallback failed');
              if (!fallbackFields.includes('Delapeer')) throw new Error('Unlabelled place fallback did not capture location');
              if (!fallbackFields.includes('Bareilly')) throw new Error('Unlabelled place fallback lost city text');
              if (!fallbackFields.includes('Driving licence not produced')) throw new Error('Numbered violation fallback failed');

              // A subsequent invalid PDF must clear the earlier successful result.
              await page.locator('#pdfFile').setInputFiles({
                name: 'invalid-test.pdf',
                mimeType: 'application/pdf',
                buffer: Buffer.from('not a PDF')
              });
              await page.locator('#readPdf').click();
              await page.waitForFunction(() => {
                const status = document.querySelector('#pdfStatus').textContent || '';
                return status.includes('मान्य header') || status.includes('PDF पढ़ी नहीं जा सकी');
              }, { timeout: 10000 });
              if (await page.locator('#results').evaluate(el => el.classList.contains('show'))) {
                throw new Error('Stale successful result remained visible after invalid PDF');
              }
              const invalidPdfStatus = await page.locator('#pdfStatus').innerText();
              if (!invalidPdfStatus.includes('मान्य header')) {
                throw new Error('Invalid PDF did not reach explicit header validation: ' + invalidPdfStatus);
              }

              // Verify the explicit clear action removes both inputs and parsed data.
              await page.locator('#pdfFile').setInputFiles({
                name: 'synthetic-challan-test.pdf',
                mimeType: 'application/pdf',
                buffer: pdfBytes
              });
              await page.locator('#readPdf').click();
              await page.locator('#results.show').waitFor({ state: 'visible', timeout: 10000 });
              await page.locator('#clear').click();
              if (await page.locator('#vehicle').inputValue() !== '') throw new Error('Clear button did not clear vehicle number');
              if (await page.locator('#pdfFile').inputValue() !== '') throw new Error('Clear button did not clear selected file');
              if (await page.locator('#results').evaluate(el => el.classList.contains('show'))) throw new Error('Clear button left results visible');
              if ((await page.locator('#rawText').innerText()).trim() !== '') throw new Error('Clear button left extracted text visible');
              if ((await page.locator('#pdfStatus').innerText()).trim() !== '') throw new Error('Clear button left PDF status visible');

              const horizontalOverflow = await page.evaluate(() =>
                document.documentElement.scrollWidth > document.documentElement.clientWidth
              );
              if (horizontalOverflow) throw new Error('Mobile viewport has horizontal overflow');
              if (failures.length) throw new Error('Browser errors: ' + failures.join(' | '));

              console.log('PASS: page loads with external network requests blocked');
              console.log('PASS: inputs and noindex directive are present');
              console.log('PASS: empty vehicle validation and normalization work');
              console.log('PASS: no-PDF validation works');
              console.log('PASS: PDF.js extracts synthetic PDF text locally');
              console.log('PASS: challan number, vehicle number, and violation fields populate');
              console.log('PASS: invalid PDF is rejected and stale results are cleared');
              console.log('PASS: clear button removes inputs, results, extracted text, and status');
              console.log('PASS: mobile viewport has no horizontal overflow');
              console.log('PASS: no uncaught page errors');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
