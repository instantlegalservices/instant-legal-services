name: Test Shared AI Rate Limit Contract
on:
  pull_request:
    paths:
      - "supabase/functions/ai-assistant/**"
      - "supabase/functions/ils-ai-assistant/**"
      - "supabase/functions/_shared/ai-rate-limit.ts"
      - "supabase/migrations/20261117063714_ils_ai_rate_limit_shared.sql"
      - "scripts/test-ai-rate-limit.mjs"
      - ".github/workflows/test-ai-rate-limit.yml"
  push:
    branches:
      - "security/ai-rate-limit-current-main-20261117"
    paths:
      - "supabase/functions/ai-assistant/**"
      - "supabase/functions/ils-ai-assistant/**"
      - "supabase/functions/_shared/ai-rate-limit.ts"
      - "supabase/migrations/20261117063714_ils_ai_rate_limit_shared.sql"
      - "scripts/test-ai-rate-limit.mjs"
      - ".github/workflows/test-ai-rate-limit.yml"
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/test-ai-rate-limit.mjs
      - uses: denoland/setup-deno@v2
      - run: deno test --allow-env supabase/functions/_shared/ai-rate-limit.test.ts
