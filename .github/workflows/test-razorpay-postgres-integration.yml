name: Razorpay PostgreSQL Integration
on:
  pull_request:
    paths:
      - "supabase/migrations/20261118191500_atomic_razorpay_payment_finalization.sql"
      - "scripts/razorpay-integration-fixture.sql"
      - "scripts/test-razorpay-postgres-integration.sh"
      - ".github/workflows/test-razorpay-postgres-integration.yml"
  workflow_dispatch:
jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ils_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ils_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run isolated migration and integration tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: ils_test
        run: bash scripts/test-razorpay-postgres-integration.sh
