                window.ILS_SUPABASE_URL = url;
                window.ILS_SUPABASE_KEY = key;
              }, { url: process.env.ILS_TEST_SUPABASE_URL, key: process.env.ILS_TEST_SUPABASE_KEY });
              await admin.goto(process.env.BASE_URL + '/admin.html', { waitUntil: 'domcontentloaded' });
              await admin.waitForFunction(() => typeof loadUpiProofs === 'function' && typeof isAdmin === 'function');
              const adminResult = await admin.evaluate(async ({ email, password, proofId, orderId }) => {
                if (SUPABASE_URL !== 'https://bgsbuepolooybdqrzmoa.supabase.co') return { ok: false, reason: 'ADMIN_NOT_POINTING_TO_TEST' };
                const { error } = await sb.auth.signInWithPassword({ email, password });
                if (error) return { ok: false, reason: 'TEST_ADMIN_LOGIN_FAILED' };
                const authorization = await isAdmin();
                if (!authorization.ok) return { ok: false, reason: 'TEST_ADMIN_AUTHORIZATION_FAILED' };
                document.getElementById('upiProofStatusFilter').value = 'pending';
                await loadUpiProofs();
                const proof = upiProofRows.find(row => row.id === proofId && row.status === 'pending' && row.order_id === orderId);
                if (!proof) return { ok: false, reason: 'FRESH_SYNTHETIC_PROOF_NOT_IN_ADMIN_QUEUE' };
                const button = document.querySelector('.upiProofVerify[data-proof-id="' + proofId + '"][data-decision="verified"]');
                if (!button) return { ok: false, reason: 'ADMIN_VERIFY_ACTION_MISSING' };
                window.confirm = () => true;
                window.prompt = () => 'TEST ONLY: synthetic fixture; no UPI payment occurred.';
                button.click();
                const started = Date.now();
                while (Date.now() - started < 15000) {
                  if ((document.getElementById('appMsg')?.innerText || '').includes('Payment proof verified')) break;
                  await new Promise(resolve => setTimeout(resolve, 150));
                }
                await loadUpiProofs();
                const decided = upiProofRows.find(row => row.id === proofId);
                if (!decided || decided.status !== 'verified' || decided.order_status !== 'paid') {
                  return { ok: false, reason: 'ADMIN_UI_DID_NOT_ATOMICALLY_VERIFY_AND_MARK_ORDER_PAID' };
                }
                return { ok: true };
              }, {
                email: process.env.ILS_TEST_ADMIN_EMAIL,
                password: process.env.ILS_TEST_ADMIN_PASSWORD,
                proofId: fixture.proofId, orderId: fixture.orderId
              });
              if (!adminResult.ok) throw new Error(adminResult.reason);

              // Sign in as the order owner and let the real customer portal resume the paid order.
              await customer.addInitScript(({ url, key, intent }) => {
                window.ILS_SUPABASE_URL = url;
                window.ILS_SUPABASE_KEY = key;
                if (location.pathname === '/customer-portal.html') {
                  const returnTo = '/assistance.html?mode=guided&problem=cyber%20fraud&route=cyber';
                  sessionStorage.setItem('ils_pending_checkout', JSON.stringify({
                    slug: 'official-route-guidance',
                    details: {
                      mode: 'guided', problem: 'TEST ONLY - synthetic payment verification',
                      route: 'cyber', checkout_intent_id: intent
                    },
                    checkoutIntentId: intent, toolRunId: null, returnTo, createdAt: Date.now()
                  }));
                }
              }, { url: process.env.ILS_TEST_SUPABASE_URL, key: process.env.ILS_TEST_SUPABASE_KEY, intent: fixture.intent });
              await customer.goto(process.env.BASE_URL + '/customer-portal.html?returnTo=' + encodeURIComponent('/assistance.html?mode=guided&problem=cyber%20fraud&route=cyber'), { waitUntil: 'domcontentloaded' });
              await customer.locator('#loginEmail').fill(process.env.ILS_TEST_NONADMIN_CUSTOMER_EMAIL);
              await customer.locator('#loginPassword').fill(process.env.ILS_TEST_NONADMIN_CUSTOMER_PASSWORD);
              await customer.locator('#loginBtn').click();
              await customer.waitForURL(url => url.pathname === '/assistance.html', { timeout: 20000 });
              await customer.waitForFunction(() =>
                (document.getElementById('paymentStatus')?.innerText || '').includes('Payment verified.') &&
                (document.getElementById('guidancePack')?.innerText || '').includes('Guidance pack unlocked'),
                null, { timeout: 15000 }
              );
              const customerResult = await customer.evaluate(() => ({
                status: document.getElementById('paymentStatus')?.innerText || '',
                guidance: document.getElementById('guidancePack')?.innerText || '',
                pendingCheckout: sessionStorage.getItem('ils_pending_checkout')
              }));
              if (customerResult.pendingCheckout !== null) throw new Error('PAID_CHECKOUT_INTENT_NOT_CLEARED_AFTER_CONFIRMED_UNLOCK');
              console.log('PASS: synthetic TEST proof verified through admin UI; order and service request paid; customer portal resumed the order and unlocked guidance. No real payment occurred.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error('POSITIVE_PAYMENT_VERIFICATION_E2E_FAILURE:', error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

