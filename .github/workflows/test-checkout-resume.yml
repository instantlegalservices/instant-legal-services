name: Checkout Resume UI E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "customer-portal.html"
      - "assistance.html"
      - "admin.html"
      - "assets/ils-tools.js"
      - "assets/ils-core.js"
      - "scripts/test-popular-assistance.js"
      - ".github/workflows/test-checkout-resume.yml"

jobs:
  checkout-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ils-http.log 2>&1 &
          echo $! > /tmp/ils-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/customer-portal.html > /dev/null

      - name: Verify Popular Assistance marketplace and SEO journeys
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/test-popular-assistance.js

      - name: Verify checkout return and tab-scoped storage
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();

              await page.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', route =>
                route.fulfill({
                  status: 200,
                  contentType: 'application/javascript',
                  body: `window.supabase = {
                    createClient: (url, key) => {
                      window.__supabaseConfig = { url, key };
                      return {
                      auth: {
                        signInWithPassword: async () => ({
                          data: { user: { id: 'e2e-customer', email: 'e2e@example.test', user_metadata: { full_name: 'E2E Customer' } } },
                          error: null
                        }),
                        signUp: async () => ({ data: { user: { id: 'e2e-customer' }, session: null }, error: null })
                      },
                      from: () => ({
                        select() { return this; },
                        eq() { return this; },
                        maybeSingle: async () => ({
                          data: { id: 'e2e-profile', full_name: 'E2E Customer', status: 'active' },
                          error: null
                        })
                      }),
                      rpc: async () => ({ data: { ok: true, customer_profile_id: 'e2e-profile' }, error: null })
                    };
                    }
                  };`
                })
              );

              const base = process.env.BASE_URL;
              await page.addInitScript(() => {
                window.ILS_SUPABASE_URL = 'https://bgsbuepolooybdqrzmoa.supabase.co';
                window.ILS_SUPABASE_KEY = 'sb_publishable_TEST_ONLY';
              });
              await page.goto(base + '/customer-portal.html?returnTo=%2Fassistance.html');
              const configured = await page.evaluate(() => window.__supabaseConfig);
              if (configured?.url !== 'https://bgsbuepolooybdqrzmoa.supabase.co' || configured?.key !== 'sb_publishable_TEST_ONLY') {
                throw new Error('Customer portal did not honor the isolated TEST Supabase runtime configuration.');
              }
              await page.evaluate(() => {
                sessionStorage.setItem('ils_pending_checkout', JSON.stringify({
                  slug: 'digital-form-assistance',
                  checkoutIntentId: 'e2e-intent',
                  createdAt: Date.now()
                }));
              });

              // A separate confirmation tab must not destroy the original tab's pending checkout.
              const confirmationTab = await context.newPage();
              await confirmationTab.goto(base + '/customer-portal.html');
              const pendingBefore = await page.evaluate(() => sessionStorage.getItem('ils_pending_checkout'));
              if (!pendingBefore || !pendingBefore.includes('e2e-intent')) {
                throw new Error('Original checkout tab lost its pending sessionStorage state.');
              }
              await confirmationTab.close();

              await page.locator('#loginEmail').fill('e2e@example.test');
              await page.locator('#loginPassword').fill('not-a-real-password');
              await page.locator('#loginBtn').click();
              await page.waitForURL('**/assistance.html', { timeout: 5000 });

              const pendingAfter = await page.evaluate(() => sessionStorage.getItem('ils_pending_checkout'));
              if (!pendingAfter || !pendingAfter.includes('e2e-intent')) {
                throw new Error('Pending checkout state did not survive same-tab sign-in redirect.');
              }

              const unsafe = await context.newPage();
              await unsafe.goto(base + '/customer-portal.html?returnTo=' + encodeURIComponent('https://evil.example/steal'));
              await unsafe.locator('#loginEmail').fill('e2e@example.test');
              await unsafe.locator('#loginPassword').fill('not-a-real-password');
              await unsafe.locator('#loginBtn').click();
              await unsafe.waitForTimeout(700);
              if (!unsafe.url().startsWith(base + '/customer-portal.html')) {
                throw new Error('External returnTo was not rejected: ' + unsafe.url());
              }

              console.log('PASS: same-tab checkout state retained; authenticated return completed; external returnTo rejected.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error('CHECKOUT_RESUME_E2E_FAILURE:', error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify assistance page restores the saved checkout intent
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();

              // Keep this test local and deterministic: no Supabase, account, or payment calls.
              await page.route('**/assets/ils-core.js*', route => route.fulfill({
                status: 200,
                contentType: 'application/javascript',
                body: `window.ILS = {
                  ready: () => null,
                  init: async () => null,
                  esc: value => String(value ?? '')
                };`
              }));
              await page.route('**/assets/ils-payments.js*', route => route.fulfill({
                status: 200, contentType: 'application/javascript', body: ''
              }));
              await page.route('**/assets/ils-tools.js*', route => route.fulfill({
                status: 200,
                contentType: 'application/javascript',
                body: `window.ILS_TOOLS = {
                  createOrder: (slug, details, toolRunId, onPaid, options) => {
                    window.__resumeCheckoutCall = { slug, details, options };
                    onPaid({ ok: true, order_id: 'mock-order-id', order_number: 'ILS-MOCK-1' });
                  }
                };`
              }));
              await page.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', route =>
                route.fulfill({
                  status: 200,
                  contentType: 'application/javascript',
                  body: `window.supabase = { createClient: (url, key) => {
                    window.__assistanceSupabaseConfig = { url, key };
                    return {};
                  }};`
                })
              );

              await page.addInitScript(() => {
                if (location.pathname !== '/assistance.html') return;
                window.ILS_SUPABASE_URL = 'https://bgsbuepolooybdqrzmoa.supabase.co';
                window.ILS_SUPABASE_KEY = 'sb_publishable_TEST_ONLY';
                const returnTo = location.pathname + location.search + location.hash;
                sessionStorage.setItem('ils_pending_checkout', JSON.stringify({
                  slug: 'official-route-guidance',
                  details: {
                    mode: 'guided',
                    problem: 'cyber fraud',
                    route: 'cyber',
                    checkout_intent_id: 'legacy-sensitive-intent'
                  },
                  checkoutIntentId: 'legacy-sensitive-intent',
                  toolRunId: null,
                  returnTo,
                  createdAt: Date.now()
                }));
              });

              await page.goto(process.env.BASE_URL + '/assistance.html?mode=guided&problem=cyber%20fraud&route=cyber');
              await page.waitForFunction(() => {
                const status = document.getElementById('paymentStatus');
                return (status?.textContent || '').includes('cleared from this browser for your privacy');
              }, null, { timeout: 5000 });

              const config = await page.evaluate(() => window.__assistanceSupabaseConfig);
              if (config?.url !== 'https://bgsbuepolooybdqrzmoa.supabase.co' || config?.key !== 'sb_publishable_TEST_ONLY') {
                throw new Error('Assistance page did not honor the isolated TEST Supabase runtime configuration.');
              }

              const call = await page.evaluate(() => window.__resumeCheckoutCall);
              if (call) throw new Error('Legacy browser-stored intake details were replayed into a new order.');
              const pending = await page.evaluate(() => sessionStorage.getItem('ils_pending_checkout'));
              if (pending !== null) throw new Error('Legacy sensitive checkout data was not cleared from session storage.');

              console.log('PASS: legacy sensitive assistance checkout data is cleared and never replayed into a new order.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error('ASSISTANCE_RESUME_E2E_FAILURE:', error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

      - name: Reject an unverified checkout callback without clearing saved intent
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();
              await page.route('**/assets/ils-core.js*', route => route.fulfill({
                status: 200, contentType: 'application/javascript',
                body: `window.ILS = { ready: () => null, init: async () => null, esc: v => String(v ?? '') };`
              }));
              await page.route('**/assets/ils-payments.js*', route => route.fulfill({
                status: 200, contentType: 'application/javascript', body: ''
              }));
              await page.route('**/assets/ils-tools.js*', route => route.fulfill({
                status: 200, contentType: 'application/javascript',
                body: `window.ILS_TOOLS = { createOrder: (slug, details, toolRunId, onPaid) => {
                  window.__resumeCheckoutCall = { slug, details };
                  onPaid({ ok: false, order_id: 'mock-unverified-order' });
                }};`
              }));
              await page.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', route => route.fulfill({
                status: 200, contentType: 'application/javascript',
                body: `window.supabase = { createClient: () => ({}) };`
              }));
              await page.addInitScript(() => {
                if (location.pathname !== '/assistance.html') return;
                window.ILS_SUPABASE_URL = 'https://bgsbuepolooybdqrzmoa.supabase.co';
                window.ILS_SUPABASE_KEY = 'sb_publishable_TEST_ONLY';
                const returnTo = location.pathname + location.search + location.hash;
                // Store only the privacy-safe checkout marker; the customer re-enters details.
                sessionStorage.setItem('ils_pending_checkout', JSON.stringify({
                  slug: 'official-route-guidance',
                  checkoutIntentId: 'negative-callback-intent',
                  toolRunId: null, returnTo, createdAt: Date.now()
                }));
              });
              await page.goto(process.env.BASE_URL + '/assistance.html?mode=guided&problem=cyber%20fraud&route=cyber');
              await page.locator('#payBtn').click();
              await page.waitForFunction(() => (document.getElementById('paymentStatus')?.textContent || '').includes('Payment/order confirmation was not verified'), null, { timeout: 5000 });
              const result = await page.evaluate(() => ({
                pending: sessionStorage.getItem('ils_pending_checkout'),
                status: document.getElementById('paymentStatus')?.textContent || '',
                guidance: document.getElementById('guidancePack')?.textContent || ''
              }));
              if (!result.pending?.includes('negative-callback-intent')) throw new Error('UNVERIFIED_CALLBACK_CLEARED_PENDING_CHECKOUT');
              if (/Payment verified|Guidance pack unlocked|Assistance request created/i.test(result.status + ' ' + result.guidance)) {
                throw new Error('UNVERIFIED_CALLBACK_SHOWED_SUCCESS_OR_UNLOCKED_ACCESS');
              }
              console.log('PASS: unverified callback rejected; pending checkout retained; no success message or access unlock.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error('UNVERIFIED_CALLBACK_REGRESSION_FAILURE:', error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify privacy-safe checkout re-entry and TEST UPI QR
        env:
          BASE_URL: http://127.0.0.1:4173
          ILS_TEST_NONADMIN_CUSTOMER_EMAIL: ${{ secrets.ILS_TEST_NONADMIN_CUSTOMER_EMAIL }}
          ILS_TEST_NONADMIN_CUSTOMER_PASSWORD: ${{ secrets.ILS_TEST_NONADMIN_CUSTOMER_PASSWORD }}
          ILS_TEST_SUPABASE_URL: https://bgsbuepolooybdqrzmoa.supabase.co
          ILS_TEST_SUPABASE_KEY: sb_publishable_eTuM4uU9TG_BqNvrcOd7cg_HWvk-Gl2
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();
              page.on('pageerror', error => console.error('Checkout page error:', String(error).slice(0, 250)));
              await page.addInitScript(({ url, key }) => {
                window.ILS_SUPABASE_URL = url;
                window.ILS_SUPABASE_KEY = key;
              }, { url: process.env.ILS_TEST_SUPABASE_URL, key: process.env.ILS_TEST_SUPABASE_KEY });

              const testStartedAt = new Date().toISOString();
              await page.goto(process.env.BASE_URL + '/assistance.html?mode=guided&problem=cyber%20fraud&route=cyber', { waitUntil: 'domcontentloaded' });
              await page.locator('#payBtn').waitFor({ state: 'visible', timeout: 15000 });
              await page.locator('#payBtn').click();
              await page.waitForURL(url => url.pathname === '/customer-portal.html', { timeout: 10000 });

              const saved = await page.evaluate(() => {
                const raw = sessionStorage.getItem('ils_pending_checkout');
                if (!raw) return null;
                try { return JSON.parse(raw); } catch { return null; }
              });
              if (saved?.slug !== 'official-route-guidance' || saved.requiresReentry !== true || saved.details || saved.checkoutIntentId) {
                throw new Error('PRIVACY_SAFE_CHECKOUT_MARKER_INVALID');
              }

              await page.locator('#loginEmail').fill(process.env.ILS_TEST_NONADMIN_CUSTOMER_EMAIL);
              await page.locator('#loginPassword').fill(process.env.ILS_TEST_NONADMIN_CUSTOMER_PASSWORD);
              await page.locator('#loginBtn').click();
              await page.waitForURL(url => url.pathname === '/assistance.html' && url.searchParams.get('mode') === 'guided', { timeout: 20000 });
              await page.waitForFunction(() => {
                const message = document.getElementById('paymentStatus')?.textContent || '';
                return message.includes('details were not saved in the browser') && message.includes('re-enter');
              }, null, { timeout: 15000 });
              const markerAfterSignIn = await page.evaluate(() => sessionStorage.getItem('ils_pending_checkout'));
              if (markerAfterSignIn !== null) {
                throw new Error('PRIVACY_SAFE_REENTRY_MARKER_NOT_CLEARED');
              }

              // The customer re-enters/continues the guided request after sign-in; this creates a fresh order.
              await page.locator('#payBtn').click();
              await page.waitForFunction(() => {
                const box = document.getElementById('toolStatus');
                return !!box?.querySelector('#payNowBtn') || !!box?.innerText?.trim();
              }, null, { timeout: 20000 });
              const orderScreen = await page.locator('#toolStatus').innerText().catch(() => '');
              if (!await page.locator('#payNowBtn').count()) {
                throw new Error('NEW_ORDER_PAYMENT_BUTTON_MISSING: ' + (orderScreen || 'No order status displayed').slice(0, 250));
              }
              await page.locator('#payNowBtn').click();
              await page.waitForSelector('#toolStatus img[src="assets/ils-upi-qr.jpg"]', { state: 'visible', timeout: 20000 });
              await page.waitForFunction(() => {
                const img = document.querySelector('#toolStatus img[src="assets/ils-upi-qr.jpg"]');
                return !!img && img.complete && img.naturalWidth > 0;
              }, null, { timeout: 10000 });

              const result = await page.evaluate(async (startedAt) => {
                const authKey = 'sb-bgsbuepolooybdqrzmoa-auth-token';
                const session = JSON.parse(localStorage.getItem(authKey) || '{}');
                if (!session.access_token) return { ok: false, reason: 'AUTH_SESSION_MISSING_AFTER_RESUME' };
                const base = window.ILS_SUPABASE_URL;
                const headers = {
                  apikey: window.ILS_SUPABASE_KEY,
                  Authorization: 'Bearer ' + session.access_token
                };
                const userResponse = await fetch(base + '/auth/v1/user', { headers });
                if (!userResponse.ok) return { ok: false, reason: 'AUTH_USER_HTTP_' + userResponse.status };
                const user = await userResponse.json();
                const requestUrl = new URL(base + '/rest/v1/service_requests');
                requestUrl.searchParams.set('select', 'id,details,created_at');
                requestUrl.searchParams.set('user_id', 'eq.' + user.id);
                requestUrl.searchParams.set('details->>problem', 'eq.cyber fraud');
                requestUrl.searchParams.set('created_at', 'gte.' + startedAt);
                requestUrl.searchParams.set('order', 'created_at.desc');
                requestUrl.searchParams.set('limit', '5');
                const requestResponse = await fetch(requestUrl, { headers });
                if (!requestResponse.ok) return { ok: false, reason: 'REQUEST_READ_HTTP_' + requestResponse.status };
                const requests = await requestResponse.json();
                if (!Array.isArray(requests) || requests.length !== 1) return { ok: false, reason: 'RESUMED_REQUEST_COUNT_' + (requests?.length ?? 'INVALID') };

                const orderUrl = new URL(base + '/rest/v1/orders');
                orderUrl.searchParams.set('select', 'id,status,service_request_id,total');
                orderUrl.searchParams.set('user_id', 'eq.' + user.id);
                orderUrl.searchParams.set('service_request_id', 'eq.' + requests[0].id);
                const orderResponse = await fetch(orderUrl, { headers });
                if (!orderResponse.ok) return { ok: false, reason: 'ORDER_READ_HTTP_' + orderResponse.status };
                const orders = await orderResponse.json();
                if (!Array.isArray(orders) || orders.length !== 1) return { ok: false, reason: 'RESUMED_ORDER_COUNT_' + (orders?.length ?? 'INVALID') };
                if (orders[0].status !== 'pending') return { ok: false, reason: 'RESUMED_ORDER_NOT_PENDING' };

                const itemUrl = new URL(base + '/rest/v1/order_items');
                itemUrl.searchParams.set('select', 'id');
                itemUrl.searchParams.set('order_id', 'eq.' + orders[0].id);
                const itemResponse = await fetch(itemUrl, { headers });
                if (!itemResponse.ok) return { ok: false, reason: 'ORDER_ITEM_READ_HTTP_' + itemResponse.status };
                const items = await itemResponse.json();
                if (!Array.isArray(items) || items.length !== 1) return { ok: false, reason: 'RESUMED_ORDER_ITEM_COUNT_' + (items?.length ?? 'INVALID') };

                const proofUrl = new URL(base + '/rest/v1/payment_proofs');
                proofUrl.searchParams.set('select', 'id');
                proofUrl.searchParams.set('order_id', 'eq.' + orders[0].id);
                const proofResponse = await fetch(proofUrl, { headers });
                if (!proofResponse.ok) return { ok: false, reason: 'PAYMENT_PROOF_READ_HTTP_' + proofResponse.status };
                const proofs = await proofResponse.json();
                if (!Array.isArray(proofs) || proofs.length !== 0) return { ok: false, reason: 'UNEXPECTED_PAYMENT_PROOF_EXISTS' };

                window.__ilsTestOrderId = orders[0].id;
                const qr = document.querySelector('#toolStatus img[src="assets/ils-upi-qr.jpg"]');
                const screenText = document.getElementById('toolStatus')?.innerText || '';
                if (!qr || !screenText.includes('8445609837@axl') || !document.getElementById('upiPaidBtn')) {
                  return { ok: false, reason: 'REAL_UPI_PAYMENT_SCREEN_INCOMPLETE' };
                }
                return { ok: true, requestCount: requests.length, orderCount: orders.length, itemCount: items.length, proofCount: proofs.length, status: orders[0].status };
              }, testStartedAt);

              if (!result.ok) throw new Error(result.reason);

              // Synthetic TEST-only PNG and transaction reference; no UPI payment is made.
              await page.locator('#upiTransactionRef').fill('ILSTEST' + Date.now().toString(36).toUpperCase());
              await page.locator('#upiPayeeName').fill('ILS AUTOMATED TEST - NOT PAID');
              await page.locator('#upiPaymentScreenshot').setInputFiles({
                name: 'ils-test-only-not-a-payment.png',
                mimeType: 'image/png',
                buffer: Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p2cAAAAASUVORK5CYII=', 'base64')
              });
              await page.locator('#upiPaidBtn').click();
              await page.waitForFunction(() => {
                const b = document.getElementById('upiPaidBtn');
                const n = document.getElementById('upiPaidNote')?.innerText || '';
                return b?.textContent?.includes('Proof Submitted') || n.includes('Payment proof submitted');
              }, null, { timeout: 20000 });

              const proof = await page.evaluate(async () => {
                const s = JSON.parse(localStorage.getItem('sb-bgsbuepolooybdqrzmoa-auth-token') || '{}');
                const headers = { apikey: window.ILS_SUPABASE_KEY, Authorization: 'Bearer ' + s.access_token, 'Content-Type': 'application/json' };
                const base = window.ILS_SUPABASE_URL;
                const listed = await fetch(base + '/rest/v1/payment_proofs?select=id,order_id,user_id,amount,upi_id,transaction_ref,screenshot_path,screenshot_sha256,mime_type,file_size_bytes,status&order_id=eq.' + encodeURIComponent(window.__ilsTestOrderId), { headers });
                if (!listed.ok) return { ok: false, reason: 'ADMIN_PROOF_LIST_HTTP_' + listed.status };
                const rows = await listed.json();
                const row = Array.isArray(rows) ? rows.find(x => x.order_id === window.__ilsTestOrderId) : null;
                if (!row || row.status !== 'pending' || !row.transaction_ref.startsWith('ILSTEST')) return { ok: false, reason: 'SYNTHETIC_PROOF_NOT_PENDING' };

                // A second submission for the same order must not create a second pending proof.
                const duplicate = await fetch(base + '/rest/v1/rpc/ils_submit_upi_payment_proof', {
                  method: 'POST', headers,
                  body: JSON.stringify({
                    p_order_id: row.order_id,
                    p_amount: row.amount,
                    p_upi_id: row.upi_id,
                    p_transaction_ref: 'ILSDUP' + Date.now().toString(36).toUpperCase(),
                    p_payee_name_claimed: 'ILS DUPLICATE TEST - NOT PAID',
                    p_screenshot_path: row.screenshot_path,
                    p_screenshot_sha256: row.screenshot_sha256,
                    p_mime_type: row.mime_type,
                    p_file_size_bytes: row.file_size_bytes
                  })
                });
                const duplicateBody = await duplicate.json().catch(() => ({}));
                if (duplicate.ok || duplicateBody.message !== 'PROOF_ALREADY_PENDING') {
                  return { ok: false, reason: 'DUPLICATE_PENDING_PROOF_NOT_REJECTED' };
                }
                const afterDuplicate = await fetch(base + '/rest/v1/payment_proofs?select=id,order_id,status&order_id=eq.' + encodeURIComponent(row.order_id), { headers });
                if (!afterDuplicate.ok) return { ok: false, reason: 'PROOF_LIST_AFTER_DUPLICATE_HTTP_' + afterDuplicate.status };
                const afterRows = await afterDuplicate.json();
                if (!Array.isArray(afterRows) || afterRows.filter(x => x.order_id === row.order_id).length !== 1) {
                  return { ok: false, reason: 'DUPLICATE_SUBMISSION_CREATED_EXTRA_PROOF' };
                }

                const stateResponse = await fetch(base + '/rest/v1/rpc/ils_get_upi_proof_status', {
                  method: 'POST', headers, body: JSON.stringify({ p_order_id: row.order_id })
                });
                if (!stateResponse.ok) return { ok: false, reason: 'PROOF_STATUS_HTTP_' + stateResponse.status };
                const state = await stateResponse.json();
                const orderResponse = await fetch(base + '/rest/v1/orders?select=id,status,service_request_id&id=eq.' + row.order_id, { headers });
                const orders = await orderResponse.json();
                if (state.proof_status !== 'pending' || state.order_status !== 'pending' || !orders[0] || orders[0].status !== 'pending') return { ok: false, reason: 'PENDING_PROOF_CHANGED_ORDER_STATE' };
                return { ok: true, proofId: row.id, orderId: row.order_id };
              });
              if (!proof.ok) throw new Error(proof.reason);
              await page.waitForFunction(() => (document.getElementById('upiPaidNote')?.innerText || '').includes('Verification is still pending'), null, { timeout: 15000 });
              console.log('PASS: synthetic TEST-only proof uploaded and remained pending; no payment or admin decision performed.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
