  authenticated-test-customer:
    name: Authenticated TEST customer smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE_URL: http://127.0.0.1:4173
      ILS_TEST_NONADMIN_CUSTOMER_EMAIL: ${{ secrets.ILS_TEST_NONADMIN_CUSTOMER_EMAIL }}
      ILS_TEST_NONADMIN_CUSTOMER_PASSWORD: ${{ secrets.ILS_TEST_NONADMIN_CUSTOMER_PASSWORD }}
      ILS_TEST_SUPABASE_URL: https://bgsbuepolooybdqrzmoa.supabase.co
      ILS_TEST_SUPABASE_KEY: sb_publishable_eTuM4uU9TG_BqNvrcOd7cg_HWvk-Gl2
    steps:
      - name: Require protected TEST customer credentials
        shell: bash
        run: |
          if [[ -z "$ILS_TEST_NONADMIN_CUSTOMER_EMAIL" || -z "$ILS_TEST_NONADMIN_CUSTOMER_PASSWORD" ]]; then
            echo "::error::Configure ILS_TEST_NONADMIN_CUSTOMER_EMAIL and ILS_TEST_NONADMIN_CUSTOMER_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ils-http-auth.log 2>&1 &
          echo $! > /tmp/ils-http-auth.pid
          sleep 2
          curl --fail --silent --show-error "$BASE_URL/customer-portal.html" > /dev/null

      - name: Sign in against real TEST Supabase and verify customer profile
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();
              page.on('console', msg => {
                if (msg.type() === 'error') console.error('Browser console error:', msg.text().slice(0, 300));
              });
              page.on('pageerror', error => console.error('Browser page error:', String(error).slice(0, 300)));

              await page.addInitScript(({ url, key }) => {
                window.ILS_SUPABASE_URL = url;
                window.ILS_SUPABASE_KEY = key;
              }, { url: process.env.ILS_TEST_SUPABASE_URL, key: process.env.ILS_TEST_SUPABASE_KEY });

              await page.goto(process.env.BASE_URL + '/customer-portal.html?returnTo=%2Fassistance.html', { waitUntil: 'domcontentloaded' });
              await page.locator('#loginEmail').fill(process.env.ILS_TEST_NONADMIN_CUSTOMER_EMAIL);
              await page.locator('#loginPassword').fill(process.env.ILS_TEST_NONADMIN_CUSTOMER_PASSWORD);
              await page.locator('#loginBtn').click();

              await page.waitForFunction(() => {
                const status = document.getElementById('status')?.textContent?.trim() || '';
                return location.pathname === '/assistance.html' || (status.length > 0 && status !== 'Ready.');
              }, null, { timeout: 20000 });

              if (new URL(page.url()).pathname !== '/assistance.html') {
                const signInStatus = (await page.locator('#status').textContent().catch(() => 'No sign-in status returned.')).trim();
                if (signInStatus.startsWith('Signed in') || signInStatus.startsWith('Customer account and profile provisioned successfully.')) {
                  await page.waitForURL(url => url.pathname === '/assistance.html', { timeout: 7000 });
                } else {
                const signInStatus = (await page.locator('#status').textContent().catch(() => 'No sign-in status returned.')).trim();
                  throw new Error('TEST_SIGN_IN_REJECTED: ' + (signInStatus || 'No sign-in status returned.'));
                }
              }

              const verification = await page.evaluate(async () => {
                const keys = Object.keys(localStorage);
                const authKey = keys.find(key => key === 'sb-bgsbuepolooybdqrzmoa-auth-token');
                if (!authKey) return { ok: false, reason: 'AUTH_SESSION_NOT_PERSISTED' };
                let session;
                try { session = JSON.parse(localStorage.getItem(authKey) || '{}'); }
                catch { return { ok: false, reason: 'AUTH_SESSION_INVALID' }; }
                if (!session.access_token) return { ok: false, reason: 'ACCESS_TOKEN_MISSING' };

                const base = window.ILS_SUPABASE_URL;
                const headers = {
                  apikey: window.ILS_SUPABASE_KEY,
                  Authorization: 'Bearer ' + session.access_token
                };
                const userResponse = await fetch(base + '/auth/v1/user', { headers });
                if (!userResponse.ok) return { ok: false, reason: 'AUTH_USER_ENDPOINT_' + userResponse.status };
                const user = await userResponse.json();
                if (!user.id) return { ok: false, reason: 'AUTH_USER_ID_MISSING' };

                const profileUrl = base + '/rest/v1/customer_profiles?select=id,status&user_id=eq.' + encodeURIComponent(user.id);
                const profileResponse = await fetch(profileUrl, { headers });
                if (!profileResponse.ok) return { ok: false, reason: 'PROFILE_ENDPOINT_' + profileResponse.status };
                const profiles = await profileResponse.json();
                if (!Array.isArray(profiles) || profiles.length !== 1) {
                  return { ok: false, reason: 'CUSTOMER_PROFILE_NOT_UNIQUE' };
                }
                if (profiles[0].status !== 'active') return { ok: false, reason: 'CUSTOMER_PROFILE_NOT_ACTIVE' };

                // A normal authenticated customer must not access admin-only proof RPCs.
                const adminListResponse = await fetch(base + '/rest/v1/rpc/ils_admin_upi_payment_proofs', {
                  method: 'POST',
                  headers: { ...headers, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ p_limit: 10 })
                });
                let adminListBody = {};
                try { adminListBody = await adminListResponse.json(); } catch {}
                if (adminListResponse.ok || adminListBody.message !== 'ADMIN_REQUIRED') {
                  return { ok: false, reason: 'NONADMIN_PROOF_LIST_NOT_BLOCKED' };
                }

                const adminVerifyResponse = await fetch(base + '/rest/v1/rpc/ils_admin_verify_upi_payment_proof', {
                  method: 'POST',
                  headers: { ...headers, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    p_proof_id: crypto.randomUUID(),
                    p_decision: 'verified',
                    p_notes: 'Automated non-admin authorization test'
                  })
                });
                let adminVerifyBody = {};
                try { adminVerifyBody = await adminVerifyResponse.json(); } catch {}
                if (adminVerifyResponse.ok || adminVerifyBody.message !== 'ADMIN_REQUIRED') {
                  return { ok: false, reason: 'NONADMIN_PROOF_VERIFY_NOT_BLOCKED' };
                }

                const intent = 'ci-' + crypto.randomUUID();
                const rpcUrl = base + '/rest/v1/rpc/ils_create_service_order';
                const rpcBody = {
                  p_service_slug: 'digital-form-assistance',
                  p_details: { checkout_intent_id: intent, test_run: true, source: 'github-actions-authenticated-idempotency' },
                  p_tool_run_id: null
                };
                const createOrder = async () => {
                  const response = await fetch(rpcUrl, {
                    method: 'POST',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify(rpcBody)
                  });
                  if (!response.ok) return { error: 'ORDER_RPC_HTTP_' + response.status };
                  return await response.json();
                };
                const first = await createOrder();
                if (first.error || !first.ok || !first.order_id) {
                  return { ok: false, reason: first.error || 'FIRST_ORDER_CREATE_FAILED' };
                }
                const second = await createOrder();
                if (second.error || !second.ok || second.order_id !== first.order_id) {
                  return { ok: false, reason: second.error || 'CHECKOUT_IDEMPOTENCY_ORDER_ID_MISMATCH' };
                }

                // A checkout token must never be reused to switch the purchased service.
                const conflictResponse = await fetch(rpcUrl, {
                  method: 'POST',
                  headers: { ...headers, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    ...rpcBody,
                    p_service_slug: 'official-route-guidance'
                  })
                });
                let conflictBody = {};
                try { conflictBody = await conflictResponse.json(); } catch {}
                if (conflictResponse.ok || conflictBody.message !== 'CHECKOUT_INTENT_CONFLICT') {
                  return { ok: false, reason: 'CHECKOUT_INTENT_SERVICE_CONFLICT_NOT_REJECTED' };
                }

                const requestUrl = new URL(base + '/rest/v1/service_requests');
                requestUrl.searchParams.set('select', 'id,service_id,details');
                requestUrl.searchParams.set('user_id', 'eq.' + user.id);
                requestUrl.searchParams.set('details->>checkout_intent_id', 'eq.' + intent);
                const requestResponse = await fetch(requestUrl, { headers });
                if (!requestResponse.ok) return { ok: false, reason: 'SERVICE_REQUEST_VERIFY_HTTP_' + requestResponse.status };
                const requests = await requestResponse.json();
                if (!Array.isArray(requests) || requests.length !== 1) {
                  return { ok: false, reason: 'CHECKOUT_IDEMPOTENCY_REQUEST_COUNT_' + (requests?.length ?? 'INVALID') };
                }

                const orderUrl = new URL(base + '/rest/v1/orders');
                orderUrl.searchParams.set('select', 'id,service_request_id,status');
                orderUrl.searchParams.set('user_id', 'eq.' + user.id);
                orderUrl.searchParams.set('service_request_id', 'eq.' + requests[0].id);
                const orderResponse = await fetch(orderUrl, { headers });
                if (!orderResponse.ok) return { ok: false, reason: 'ORDER_VERIFY_HTTP_' + orderResponse.status };
                const orders = await orderResponse.json();
                if (!Array.isArray(orders) || orders.length !== 1 || orders[0].id !== first.order_id) {
                  return { ok: false, reason: 'CHECKOUT_IDEMPOTENCY_ORDER_COUNT_' + (orders?.length ?? 'INVALID') };
                }

                const itemUrl = new URL(base + '/rest/v1/order_items');
                itemUrl.searchParams.set('select', 'id,order_id');
                itemUrl.searchParams.set('order_id', 'eq.' + first.order_id);
                const itemResponse = await fetch(itemUrl, { headers });
                if (!itemResponse.ok) return { ok: false, reason: 'ORDER_ITEM_VERIFY_HTTP_' + itemResponse.status };
                const items = await itemResponse.json();
                if (!Array.isArray(items) || items.length !== 1) {
                  return { ok: false, reason: 'CHECKOUT_IDEMPOTENCY_ITEM_COUNT_' + (items?.length ?? 'INVALID') };
                }
                if (orders[0].status !== 'pending') return { ok: false, reason: 'TEST_ORDER_NOT_PENDING' };

                // Exercise the actual ₹299 marketplace price against TEST schema/RPC.
                // This creates a pending TEST order only; it does not submit or approve a payment proof.
                const feeIntent = 'ci-299-' + crypto.randomUUID();
                const feeResponse = await fetch(rpcUrl, {
                  method: 'POST',
                  headers: { ...headers, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    p_service_slug: 'ils-enquiry-fee-199',
                    p_details: { checkout_intent_id: feeIntent, test_run: true, source: 'github-actions-299-marketplace-smoke' },
                    p_tool_run_id: null
                  })
                });
                const feeOrder = feeResponse.ok ? await feeResponse.json() : {};
                if (!feeResponse.ok || !feeOrder.ok || !feeOrder.order_id ||
                    Number(feeOrder.amount) !== 299 || feeOrder.currency !== 'INR' ||
                    feeOrder.status !== 'pending') {
                  return { ok: false, reason: 'ILS_299_MARKETPLACE_ORDER_INVALID: ' + (feeOrder.message || feeResponse.status) };
                }

                return { ok: true, idempotency: true, unpaid: true, marketplace299: true };

              });

              if (!verification.ok) throw new Error(verification.reason);

              // Reopen the customer portal in the same authenticated TEST browser session.
              // The preceding idempotent service-order creation is the real source event;
              // this verifies its delivered projection is rendered by the actual portal UI.
              let notificationResponse = null;
              page.on('response', response => {
                if (response.url().includes('/rest/v1/ils_notification_customer_projection?')) {
                  notificationResponse = response;
                }
              });
              const projectionResponse = page.waitForResponse(response =>
                response.url().includes('/rest/v1/ils_notification_customer_projection?') && response.status() === 200,
                { timeout: 20000 }
              );
              await page.goto(process.env.BASE_URL + '/customer-portal.html', { waitUntil: 'domcontentloaded' });
              notificationResponse = await projectionResponse;
              await page.waitForFunction(() => {
                const panel = document.getElementById('customerNotifications');
                return !!panel && panel.querySelectorAll('article').length > 0;
              }, null, { timeout: 20000 });
              if (!notificationResponse || !notificationResponse.ok()) {
                throw new Error('CUSTOMER_NOTIFICATION_PROJECTION_QUERY_FAILED');
              }
              const notificationUi = await page.evaluate(() => ({
                dashboardVisible: !document.getElementById('clientDashboard')?.classList.contains('hidden'),
                panelText: document.getElementById('customerNotifications')?.innerText || '',
                cards: document.querySelectorAll('#customerNotifications article').length
              }));
              if (!notificationUi.dashboardVisible) throw new Error('CUSTOMER_PORTAL_DASHBOARD_NOT_VISIBLE_AFTER_AUTH');
              if (notificationUi.cards < 1) {
                throw new Error('SOURCE_EVENT_NOTIFICATION_NOT_RENDERED: ' + notificationUi.panelText.slice(0, 180));
              }
              if (/SYNTHETIC_READY/i.test(notificationUi.panelText)) {
                throw new Error('SYNTHETIC_NOTIFICATION_LEAKED_INTO_CUSTOMER_PORTAL');
              }

              console.log('PASS: TEST customer RLS and checkout idempotency passed; ₹299 marketplace RPC created a pending INR 299 order; authenticated customer portal rendered a delivered source-event notification. No payment proof was submitted or approved.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error('REAL_TEST_CUSTOMER_AUTH_FAILURE:', error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

