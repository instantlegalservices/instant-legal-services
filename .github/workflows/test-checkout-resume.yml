      - name: Verify synthetic TEST payment through admin UI and unlock customer access
        env:
          BASE_URL: http://127.0.0.1:4173
          ILS_TEST_ADMIN_EMAIL: ${{ secrets.ILS_TEST_ADMIN_EMAIL }}
          ILS_TEST_ADMIN_PASSWORD: ${{ secrets.ILS_TEST_ADMIN_PASSWORD }}
          ILS_TEST_NONADMIN_CUSTOMER_EMAIL: ${{ secrets.ILS_TEST_NONADMIN_CUSTOMER_EMAIL }}
          ILS_TEST_NONADMIN_CUSTOMER_PASSWORD: ${{ secrets.ILS_TEST_NONADMIN_CUSTOMER_PASSWORD }}
          ILS_TEST_SUPABASE_URL: https://bgsbuepolooybdqrzmoa.supabase.co
          ILS_TEST_SUPABASE_KEY: sb_publishable_eTuM4uU9TG_BqNvrcOd7cg_HWvk-Gl2
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const customer = await context.newPage();
              await customer.addInitScript(({ url, key }) => {
                window.ILS_SUPABASE_URL = url;
                window.ILS_SUPABASE_KEY = key;
              }, { url: process.env.ILS_TEST_SUPABASE_URL, key: process.env.ILS_TEST_SUPABASE_KEY });
              // Trigger the init script on a real same-origin document before using the configured TEST URL.
              await customer.goto(process.env.BASE_URL + '/customer-portal.html', { waitUntil: 'domcontentloaded' });

              // Create a fresh, explicitly synthetic TEST order owned by the non-admin customer.
              const fixture = await customer.evaluate(async ({ email, password }) => {
                const base = window.ILS_SUPABASE_URL, key = window.ILS_SUPABASE_KEY;
                const login = await fetch(base + '/auth/v1/token?grant_type=password', {
                  method: 'POST',
                  headers: { apikey: key, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ email, password })
                });
                const session = await login.json().catch(() => ({}));
                if (!login.ok || !session.access_token || !session.user?.id) return { ok: false, reason: 'TEST_CUSTOMER_LOGIN_FAILED' };
                const headers = { apikey: key, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' };
                const intent = 'ci-positive-' + crypto.randomUUID();
                const created = await fetch(base + '/rest/v1/rpc/ils_create_service_order', {
                  method: 'POST', headers,
                  body: JSON.stringify({
                    p_service_slug: 'official-route-guidance',
                    p_details: {
                      mode: 'guided', problem: 'TEST ONLY - synthetic payment verification',
                      route: 'cyber', checkout_intent_id: intent,
                      test_run: true, source: 'github-actions-positive-verification'
                    },
                    p_tool_run_id: null
                  })
                });
                const order = await created.json().catch(() => ({}));
                if (!created.ok || !order.ok || !order.order_id || order.status !== 'pending') {
                  return { ok: false, reason: 'SYNTHETIC_TEST_ORDER_CREATE_FAILED: ' + (order.message || created.status) };
                }

                // Upload a tiny valid PNG fixture to the private TEST bucket; no bank/UPI payment is made.
                const path = session.user.id + '/' + order.order_id + '/ils-positive-test.png';
                const pngBase64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p2cAAAAASUVORK5CYII=';
                const binary = Uint8Array.from(atob(pngBase64), c => c.charCodeAt(0));
                const upload = await fetch(base + '/storage/v1/object/payment-proofs/' + path.split('/').map(encodeURIComponent).join('/'), {
                  method: 'POST',
                  headers: { apikey: key, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'image/png', 'x-upsert': 'false' },
                  body: binary
                });
                if (!upload.ok) return { ok: false, reason: 'SYNTHETIC_TEST_STORAGE_UPLOAD_FAILED_' + upload.status };

                const digest = await crypto.subtle.digest('SHA-256', binary);
                const hash = Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
                const reference = 'ILSPOS' + Date.now().toString(36).toUpperCase() + crypto.randomUUID().replace(/-/g, '').slice(0, 8).toUpperCase();
                const submitted = await fetch(base + '/rest/v1/rpc/ils_submit_upi_payment_proof', {
                  method: 'POST', headers,
                  body: JSON.stringify({
                    p_order_id: order.order_id, p_amount: order.amount, p_upi_id: '8445609837@axl',
                    p_transaction_ref: reference, p_payee_name_claimed: 'ILS TEST FIXTURE - NOT PAID',
                    p_screenshot_path: path, p_screenshot_sha256: hash,
                    p_mime_type: 'image/png', p_file_size_bytes: binary.byteLength
                  })
                });
                const proof = await submitted.json().catch(() => ({}));
                if (!submitted.ok || !proof.ok || proof.status !== 'pending') {
                  return { ok: false, reason: 'SYNTHETIC_TEST_PROOF_SUBMISSION_FAILED: ' + (proof.message || submitted.status) };
                }
                return { ok: true, orderId: order.order_id, proofId: proof.proof_id, intent, reference };
              }, {
                email: process.env.ILS_TEST_NONADMIN_CUSTOMER_EMAIL,
                password: process.env.ILS_TEST_NONADMIN_CUSTOMER_PASSWORD
              });
              if (!fixture.ok) throw new Error(fixture.reason);

              // Verify only the fresh ILSPOS fixture through the actual admin.html UI.
              const admin = await context.newPage();
