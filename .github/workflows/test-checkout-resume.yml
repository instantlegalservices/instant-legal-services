                      ...overrides
                    })
                  });
                  const body = await response.json().catch(() => ({}));
                  return { data: body, error: response.ok ? null : { message: body.message || body.details || 'HTTP_' + response.status } };
                };
                const badSize = await submitAttempt({ p_file_size_bytes: proof.file_size_bytes + 1 });
                if (!badSize.error?.message?.includes('PAYMENT_PROOF_SIZE_MISMATCH')) {
