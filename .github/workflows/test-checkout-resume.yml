name: Checkout Resume UI E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "customer-portal.html"
      - "assistance.html"
      - "assets/ils-tools.js"
      - ".github/workflows/test-checkout-resume.yml"

jobs:
  checkout-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ils-http.log 2>&1 &
          echo $! > /tmp/ils-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/customer-portal.html > /dev/null

      - name: Verify checkout return and tab-scoped storage
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();

              await page.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', route =>
                route.fulfill({
                  status: 200,
                  contentType: 'application/javascript',
                  body: `window.supabase = {
                    createClient: (url, key) => {
                      window.__supabaseConfig = { url, key };
                      return {
                      auth: {
                        signInWithPassword: async () => ({
                          data: { user: { id: 'e2e-customer', email: 'e2e@example.test', user_metadata: { full_name: 'E2E Customer' } } },
                          error: null
                        }),
                        signUp: async () => ({ data: { user: { id: 'e2e-customer' }, session: null }, error: null })
                      },
                      from: () => ({
                        select() { return this; },
                        eq() { return this; },
                        maybeSingle: async () => ({
                          data: { id: 'e2e-profile', full_name: 'E2E Customer', status: 'active' },
                          error: null
                        })
                      }),
                      rpc: async () => ({ data: { ok: true, customer_profile_id: 'e2e-profile' }, error: null })
                    };
                    }
                  };`
                })
              );

              const base = process.env.BASE_URL;
              await page.addInitScript(() => {
                window.ILS_SUPABASE_URL = 'https://bgsbuepolooybdqrzmoa.supabase.co';
                window.ILS_SUPABASE_KEY = 'sb_publishable_TEST_ONLY';
              });
              await page.goto(base + '/customer-portal.html?returnTo=%2Fassistance.html');
              const configured = await page.evaluate(() => window.__supabaseConfig);
              if (configured?.url !== 'https://bgsbuepolooybdqrzmoa.supabase.co' || configured?.key !== 'sb_publishable_TEST_ONLY') {
                throw new Error('Customer portal did not honor the isolated TEST Supabase runtime configuration.');
              }
              await page.evaluate(() => {
                sessionStorage.setItem('ils_pending_checkout', JSON.stringify({
                  slug: 'digital-form-assistance',
                  checkoutIntentId: 'e2e-intent',
                  createdAt: Date.now()
                }));
              });

              // A separate confirmation tab must not destroy the original tab's pending checkout.
              const confirmationTab = await context.newPage();
              await confirmationTab.goto(base + '/customer-portal.html');
              const pendingBefore = await page.evaluate(() => sessionStorage.getItem('ils_pending_checkout'));
              if (!pendingBefore || !pendingBefore.includes('e2e-intent')) {
                throw new Error('Original checkout tab lost its pending sessionStorage state.');
              }
              await confirmationTab.close();

              await page.locator('#loginEmail').fill('e2e@example.test');
              await page.locator('#loginPassword').fill('not-a-real-password');
              await page.locator('#loginBtn').click();
              await page.waitForURL('**/assistance.html', { timeout: 5000 });

              const pendingAfter = await page.evaluate(() => sessionStorage.getItem('ils_pending_checkout'));
              if (!pendingAfter || !pendingAfter.includes('e2e-intent')) {
                throw new Error('Pending checkout state did not survive same-tab sign-in redirect.');
              }

              const unsafe = await context.newPage();
              await unsafe.goto(base + '/customer-portal.html?returnTo=' + encodeURIComponent('https://evil.example/steal'));
              await unsafe.locator('#loginEmail').fill('e2e@example.test');
              await unsafe.locator('#loginPassword').fill('not-a-real-password');
              await unsafe.locator('#loginBtn').click();
              await unsafe.waitForTimeout(700);
              if (!unsafe.url().startsWith(base + '/customer-portal.html')) {
                throw new Error('External returnTo was not rejected: ' + unsafe.url());
              }

              console.log('PASS: same-tab checkout state retained; authenticated return completed; external returnTo rejected.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error('CHECKOUT_RESUME_E2E_FAILURE:', error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify assistance page restores the saved checkout intent
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();

              // Keep this test local and deterministic: no Supabase, account, or payment calls.
              await page.route('**/assets/ils-core.js*', route => route.fulfill({
                status: 200,
                contentType: 'application/javascript',
                body: `window.ILS = {
                  ready: () => null,
                  init: async () => null,
                  esc: value => String(value ?? '')
                };`
              }));
              await page.route('**/assets/ils-payments.js*', route => route.fulfill({
                status: 200, contentType: 'application/javascript', body: ''
              }));
              await page.route('**/assets/ils-tools.js*', route => route.fulfill({
                status: 200,
                contentType: 'application/javascript',
                body: `window.ILS_TOOLS = {
                  createOrder: (slug, details, toolRunId, onPaid, options) => {
                    window.__resumeCheckoutCall = { slug, details, options };
                    onPaid({ ok: true, order_id: 'mock-order-id', order_number: 'ILS-MOCK-1' });
                  }
                };`
              }));
              await page.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', route =>
                route.fulfill({
                  status: 200,
                  contentType: 'application/javascript',
                  body: `window.supabase = { createClient: (url, key) => {
                    window.__assistanceSupabaseConfig = { url, key };
                    return {};
                  }};`
                })
              );

              await page.addInitScript(() => {
                if (location.pathname !== '/assistance.html') return;
                window.ILS_SUPABASE_URL = 'https://bgsbuepolooybdqrzmoa.supabase.co';
                window.ILS_SUPABASE_KEY = 'sb_publishable_TEST_ONLY';
                const returnTo = location.pathname + location.search + location.hash;
                sessionStorage.setItem('ils_pending_checkout', JSON.stringify({
                  slug: 'official-route-guidance',
                  details: {
                    mode: 'guided',
                    problem: 'cyber fraud',
                    route: 'cyber',
                    checkout_intent_id: 'resume-e2e-intent'
                  },
                  checkoutIntentId: 'resume-e2e-intent',
                  toolRunId: null,
                  returnTo,
                  createdAt: Date.now()
                }));
              });

              await page.goto(process.env.BASE_URL + '/assistance.html?mode=guided&problem=cyber%20fraud&route=cyber');
              await page.waitForFunction(() => document.getElementById('paymentStatus')?.textContent.includes('Payment verified. Order: ILS-MOCK-1'), null, { timeout: 5000 });

              const config = await page.evaluate(() => window.__assistanceSupabaseConfig);
              if (config?.url !== 'https://bgsbuepolooybdqrzmoa.supabase.co' || config?.key !== 'sb_publishable_TEST_ONLY') {
                throw new Error('Assistance page did not honor the isolated TEST Supabase runtime configuration.');
              }

              const call = await page.evaluate(() => window.__resumeCheckoutCall);
              if (!call) throw new Error('Assistance page did not invoke the checkout module.');
              if (call.slug !== 'official-route-guidance') throw new Error('Wrong service slug restored.');
              if (call.details?.checkout_intent_id !== 'resume-e2e-intent') throw new Error('Checkout intent was not forwarded.');
              if (call.options?.resumeCheckout !== true || call.options?.forceQr !== true) {
                throw new Error('Resume checkout options were not preserved.');
              }
              const pending = await page.evaluate(() => sessionStorage.getItem('ils_pending_checkout'));
              if (pending !== null) throw new Error('Saved checkout was not cleared after the simulated paid callback.');

              console.log('PASS: assistance page restored the matching checkout, forwarded its intent and options, and cleared storage only after the simulated paid callback.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error('ASSISTANCE_RESUME_E2E_FAILURE:', error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify real unauthenticated checkout resumes to TEST UPI QR
        env:
          BASE_URL: http://127.0.0.1:4173
          ILS_TEST_CUSTOMER_EMAIL: ${{ secrets.ILS_TEST_CUSTOMER_EMAIL }}
          ILS_TEST_CUSTOMER_PASSWORD: ${{ secrets.ILS_TEST_CUSTOMER_PASSWORD }}
          ILS_TEST_SUPABASE_URL: https://bgsbuepolooybdqrzmoa.supabase.co
          ILS_TEST_SUPABASE_KEY: sb_publishable_eTuM4uU9TG_BqNvrcOd7cg_HWvk-Gl2
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();
              page.on('pageerror', error => console.error('Checkout page error:', String(error).slice(0, 250)));
              await page.addInitScript(({ url, key }) => {
                window.ILS_SUPABASE_URL = url;
                window.ILS_SUPABASE_KEY = key;
              }, { url: process.env.ILS_TEST_SUPABASE_URL, key: process.env.ILS_TEST_SUPABASE_KEY });

              await page.goto(process.env.BASE_URL + '/assistance.html?mode=guided&problem=cyber%20fraud&route=cyber', { waitUntil: 'domcontentloaded' });
              await page.locator('#payBtn').waitFor({ state: 'visible', timeout: 15000 });
              await page.locator('#payBtn').click();
              await page.waitForURL(url => url.pathname === '/customer-portal.html', { timeout: 10000 });

              const saved = await page.evaluate(() => {
                const raw = sessionStorage.getItem('ils_pending_checkout');
                if (!raw) return null;
                try { return JSON.parse(raw); } catch { return null; }
              });
              if (!saved?.checkoutIntentId || saved.slug !== 'official-route-guidance') {
                throw new Error('CHECKOUT_INTENT_NOT_PERSISTED_BEFORE_SIGN_IN');
              }

              await page.locator('#loginEmail').fill(process.env.ILS_TEST_CUSTOMER_EMAIL);
              await page.locator('#loginPassword').fill(process.env.ILS_TEST_CUSTOMER_PASSWORD);
              await page.locator('#loginBtn').click();
              await page.waitForURL(url => url.pathname === '/assistance.html', { timeout: 20000 });
              await page.waitForSelector('#toolStatus img[src="assets/ils-upi-qr.jpg"]', { state: 'visible', timeout: 20000 });
              await page.waitForFunction(() => {
                const img = document.querySelector('#toolStatus img[src="assets/ils-upi-qr.jpg"]');
                return !!img && img.complete && img.naturalWidth > 0;
              }, null, { timeout: 10000 });

              const result = await page.evaluate(async () => {
                const raw = sessionStorage.getItem('ils_pending_checkout');
                if (!raw) return { ok: false, reason: 'PENDING_INTENT_CLEARED_BEFORE_PAYMENT' };
                const pending = JSON.parse(raw);
                const authKey = 'sb-bgsbuepolooybdqrzmoa-auth-token';
                const session = JSON.parse(localStorage.getItem(authKey) || '{}');
                if (!session.access_token) return { ok: false, reason: 'AUTH_SESSION_MISSING_AFTER_RESUME' };
                const base = window.ILS_SUPABASE_URL;
                const headers = {
                  apikey: window.ILS_SUPABASE_KEY,
                  Authorization: 'Bearer ' + session.access_token
                };
                const userResponse = await fetch(base + '/auth/v1/user', { headers });
                if (!userResponse.ok) return { ok: false, reason: 'AUTH_USER_HTTP_' + userResponse.status };
                const user = await userResponse.json();
                const requestUrl = new URL(base + '/rest/v1/service_requests');
                requestUrl.searchParams.set('select', 'id,details');
                requestUrl.searchParams.set('user_id', 'eq.' + user.id);
                requestUrl.searchParams.set('details->>checkout_intent_id', 'eq.' + pending.checkoutIntentId);
                const requestResponse = await fetch(requestUrl, { headers });
                if (!requestResponse.ok) return { ok: false, reason: 'REQUEST_READ_HTTP_' + requestResponse.status };
                const requests = await requestResponse.json();
                if (!Array.isArray(requests) || requests.length !== 1) return { ok: false, reason: 'RESUMED_REQUEST_COUNT_' + (requests?.length ?? 'INVALID') };

                const orderUrl = new URL(base + '/rest/v1/orders');
                orderUrl.searchParams.set('select', 'id,status,service_request_id,total');
                orderUrl.searchParams.set('user_id', 'eq.' + user.id);
                orderUrl.searchParams.set('service_request_id', 'eq.' + requests[0].id);
                const orderResponse = await fetch(orderUrl, { headers });
                if (!orderResponse.ok) return { ok: false, reason: 'ORDER_READ_HTTP_' + orderResponse.status };
                const orders = await orderResponse.json();
                if (!Array.isArray(orders) || orders.length !== 1) return { ok: false, reason: 'RESUMED_ORDER_COUNT_' + (orders?.length ?? 'INVALID') };
                if (orders[0].status !== 'pending') return { ok: false, reason: 'RESUMED_ORDER_NOT_PENDING' };

                const itemUrl = new URL(base + '/rest/v1/order_items');
                itemUrl.searchParams.set('select', 'id');
                itemUrl.searchParams.set('order_id', 'eq.' + orders[0].id);
                const itemResponse = await fetch(itemUrl, { headers });
                if (!itemResponse.ok) return { ok: false, reason: 'ORDER_ITEM_READ_HTTP_' + itemResponse.status };
                const items = await itemResponse.json();
                if (!Array.isArray(items) || items.length !== 1) return { ok: false, reason: 'RESUMED_ORDER_ITEM_COUNT_' + (items?.length ?? 'INVALID') };

                const proofUrl = new URL(base + '/rest/v1/payment_proofs');
                proofUrl.searchParams.set('select', 'id');
                proofUrl.searchParams.set('order_id', 'eq.' + orders[0].id);
                const proofResponse = await fetch(proofUrl, { headers });
                if (!proofResponse.ok) return { ok: false, reason: 'PAYMENT_PROOF_READ_HTTP_' + proofResponse.status };
                const proofs = await proofResponse.json();
                if (!Array.isArray(proofs) || proofs.length !== 0) return { ok: false, reason: 'UNEXPECTED_PAYMENT_PROOF_EXISTS' };

                const qr = document.querySelector('#toolStatus img[src="assets/ils-upi-qr.jpg"]');
                const screenText = document.getElementById('toolStatus')?.innerText || '';
                if (!qr || !screenText.includes('8445609837@axl') || !document.getElementById('upiPaidBtn')) {
                  return { ok: false, reason: 'REAL_UPI_PAYMENT_SCREEN_INCOMPLETE' };
                }
                return { ok: true, requestCount: requests.length, orderCount: orders.length, itemCount: items.length, proofCount: proofs.length, status: orders[0].status };
              });

              if (!result.ok) throw new Error(result.reason);
              console.log('PASS: unauthenticated checkout persisted in the same tab, real TEST sign-in resumed the exact intent, and the actual UPI QR screen displayed for one pending unpaid order; no proof submitted.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error('REAL_CHECKOUT_RESUME_QR_FAILURE:', error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

      - name: Stop local site
        if: always()
        run: |
          if [ -f /tmp/ils-http.pid ]; then kill "$(cat /tmp/ils-http.pid)" || true; fi

  authenticated-test-customer:
    name: Authenticated TEST customer smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE_URL: http://127.0.0.1:4173
      ILS_TEST_CUSTOMER_EMAIL: ${{ secrets.ILS_TEST_CUSTOMER_EMAIL }}
      ILS_TEST_CUSTOMER_PASSWORD: ${{ secrets.ILS_TEST_CUSTOMER_PASSWORD }}
      ILS_TEST_SUPABASE_URL: https://bgsbuepolooybdqrzmoa.supabase.co
      ILS_TEST_SUPABASE_KEY: sb_publishable_eTuM4uU9TG_BqNvrcOd7cg_HWvk-Gl2
    steps:
      - name: Require protected TEST customer credentials
        shell: bash
        run: |
          if [[ -z "$ILS_TEST_CUSTOMER_EMAIL" || -z "$ILS_TEST_CUSTOMER_PASSWORD" ]]; then
            echo "::error::Configure ILS_TEST_CUSTOMER_EMAIL and ILS_TEST_CUSTOMER_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ils-http-auth.log 2>&1 &
          echo $! > /tmp/ils-http-auth.pid
          sleep 2
          curl --fail --silent --show-error "$BASE_URL/customer-portal.html" > /dev/null

      - name: Sign in against real TEST Supabase and verify customer profile
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              const page = await context.newPage();
              page.on('console', msg => {
                if (msg.type() === 'error') console.error('Browser console error:', msg.text().slice(0, 300));
              });
              page.on('pageerror', error => console.error('Browser page error:', String(error).slice(0, 300)));

              await page.addInitScript(({ url, key }) => {
                window.ILS_SUPABASE_URL = url;
                window.ILS_SUPABASE_KEY = key;
              }, { url: process.env.ILS_TEST_SUPABASE_URL, key: process.env.ILS_TEST_SUPABASE_KEY });

              await page.goto(process.env.BASE_URL + '/customer-portal.html?returnTo=%2Fassistance.html', { waitUntil: 'domcontentloaded' });
              await page.locator('#loginEmail').fill(process.env.ILS_TEST_CUSTOMER_EMAIL);
              await page.locator('#loginPassword').fill(process.env.ILS_TEST_CUSTOMER_PASSWORD);
              await page.locator('#loginBtn').click();

              await page.waitForFunction(() => {
                const status = document.getElementById('status')?.textContent?.trim() || '';
                return location.pathname === '/assistance.html' || (status.length > 0 && status !== 'Ready.');
              }, null, { timeout: 20000 });

              if (new URL(page.url()).pathname !== '/assistance.html') {
                const signInStatus = (await page.locator('#status').textContent().catch(() => 'No sign-in status returned.')).trim();
                if (signInStatus.startsWith('Signed in') || signInStatus.startsWith('Customer account and profile provisioned successfully.')) {
                  await page.waitForURL(url => url.pathname === '/assistance.html', { timeout: 7000 });
                } else {
                const signInStatus = (await page.locator('#status').textContent().catch(() => 'No sign-in status returned.')).trim();
                  throw new Error('TEST_SIGN_IN_REJECTED: ' + (signInStatus || 'No sign-in status returned.'));
                }
              }

              const verification = await page.evaluate(async () => {
                const keys = Object.keys(localStorage);
                const authKey = keys.find(key => key === 'sb-bgsbuepolooybdqrzmoa-auth-token');
                if (!authKey) return { ok: false, reason: 'AUTH_SESSION_NOT_PERSISTED' };
                let session;
                try { session = JSON.parse(localStorage.getItem(authKey) || '{}'); }
                catch { return { ok: false, reason: 'AUTH_SESSION_INVALID' }; }
                if (!session.access_token) return { ok: false, reason: 'ACCESS_TOKEN_MISSING' };

                const base = window.ILS_SUPABASE_URL;
                const headers = {
                  apikey: window.ILS_SUPABASE_KEY,
                  Authorization: 'Bearer ' + session.access_token
                };
                const userResponse = await fetch(base + '/auth/v1/user', { headers });
                if (!userResponse.ok) return { ok: false, reason: 'AUTH_USER_ENDPOINT_' + userResponse.status };
                const user = await userResponse.json();
                if (!user.id) return { ok: false, reason: 'AUTH_USER_ID_MISSING' };

                const profileUrl = base + '/rest/v1/customer_profiles?select=id,status&user_id=eq.' + encodeURIComponent(user.id);
                const profileResponse = await fetch(profileUrl, { headers });
                if (!profileResponse.ok) return { ok: false, reason: 'PROFILE_ENDPOINT_' + profileResponse.status };
                const profiles = await profileResponse.json();
                if (!Array.isArray(profiles) || profiles.length !== 1) {
                  return { ok: false, reason: 'CUSTOMER_PROFILE_NOT_UNIQUE' };
                }
                if (profiles[0].status !== 'active') return { ok: false, reason: 'CUSTOMER_PROFILE_NOT_ACTIVE' };

                // The confirmed TEST owner identity is also the isolated TEST admin.
                // Exercise admin RPC authorization with its real Supabase JWT.
                const adminListResponse = await fetch(base + '/rest/v1/rpc/ils_admin_upi_payment_proofs', {
                  method: 'POST',
                  headers: { ...headers, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ p_limit: 10 })
                });
                if (!adminListResponse.ok) {
                  return { ok: false, reason: 'ADMIN_PROOF_LIST_HTTP_' + adminListResponse.status };
                }
                const adminProofs = await adminListResponse.json();
                if (!Array.isArray(adminProofs) || adminProofs.length !== 0) {
                  return { ok: false, reason: 'ADMIN_PROOF_LIST_UNEXPECTED_ROWS' };
                }

                const missingProofResponse = await fetch(base + '/rest/v1/rpc/ils_admin_verify_upi_payment_proof', {
                  method: 'POST',
                  headers: { ...headers, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    p_proof_id: crypto.randomUUID(),
                    p_decision: 'verified',
                    p_notes: 'Automated negative test: proof must not exist'
                  })
                });
                let missingProofBody = {};
                try { missingProofBody = await missingProofResponse.json(); } catch {}
                if (missingProofResponse.ok || missingProofBody.message !== 'PROOF_NOT_FOUND') {
                  return { ok: false, reason: 'ADMIN_PROOF_NEGATIVE_CHECK_DID_NOT_REACH_NOT_FOUND' };
                }

                const intent = 'ci-' + crypto.randomUUID();
                const rpcUrl = base + '/rest/v1/rpc/ils_create_service_order';
                const rpcBody = {
                  p_service_slug: 'digital-form-assistance',
                  p_details: { checkout_intent_id: intent, test_run: true, source: 'github-actions-authenticated-idempotency' },
                  p_tool_run_id: null
                };
                const createOrder = async () => {
                  const response = await fetch(rpcUrl, {
                    method: 'POST',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify(rpcBody)
                  });
                  if (!response.ok) return { error: 'ORDER_RPC_HTTP_' + response.status };
                  return await response.json();
                };
                const first = await createOrder();
                if (first.error || !first.ok || !first.order_id) {
                  return { ok: false, reason: first.error || 'FIRST_ORDER_CREATE_FAILED' };
                }
                const second = await createOrder();
                if (second.error || !second.ok || second.order_id !== first.order_id) {
                  return { ok: false, reason: second.error || 'CHECKOUT_IDEMPOTENCY_ORDER_ID_MISMATCH' };
                }

                const requestUrl = new URL(base + '/rest/v1/service_requests');
                requestUrl.searchParams.set('select', 'id,service_id,details');
                requestUrl.searchParams.set('user_id', 'eq.' + user.id);
                requestUrl.searchParams.set('details->>checkout_intent_id', 'eq.' + intent);
                const requestResponse = await fetch(requestUrl, { headers });
                if (!requestResponse.ok) return { ok: false, reason: 'SERVICE_REQUEST_VERIFY_HTTP_' + requestResponse.status };
                const requests = await requestResponse.json();
                if (!Array.isArray(requests) || requests.length !== 1) {
                  return { ok: false, reason: 'CHECKOUT_IDEMPOTENCY_REQUEST_COUNT_' + (requests?.length ?? 'INVALID') };
                }

                const orderUrl = new URL(base + '/rest/v1/orders');
                orderUrl.searchParams.set('select', 'id,service_request_id,status');
                orderUrl.searchParams.set('user_id', 'eq.' + user.id);
                orderUrl.searchParams.set('service_request_id', 'eq.' + requests[0].id);
                const orderResponse = await fetch(orderUrl, { headers });
                if (!orderResponse.ok) return { ok: false, reason: 'ORDER_VERIFY_HTTP_' + orderResponse.status };
                const orders = await orderResponse.json();
                if (!Array.isArray(orders) || orders.length !== 1 || orders[0].id !== first.order_id) {
                  return { ok: false, reason: 'CHECKOUT_IDEMPOTENCY_ORDER_COUNT_' + (orders?.length ?? 'INVALID') };
                }

                const itemUrl = new URL(base + '/rest/v1/order_items');
                itemUrl.searchParams.set('select', 'id,order_id');
                itemUrl.searchParams.set('order_id', 'eq.' + first.order_id);
                const itemResponse = await fetch(itemUrl, { headers });
                if (!itemResponse.ok) return { ok: false, reason: 'ORDER_ITEM_VERIFY_HTTP_' + itemResponse.status };
                const items = await itemResponse.json();
                if (!Array.isArray(items) || items.length !== 1) {
                  return { ok: false, reason: 'CHECKOUT_IDEMPOTENCY_ITEM_COUNT_' + (items?.length ?? 'INVALID') };
                }
                if (orders[0].status !== 'pending') return { ok: false, reason: 'TEST_ORDER_NOT_PENDING' };
                return { ok: true, idempotency: true, unpaid: true };

              });

              if (!verification.ok) throw new Error(verification.reason);
              console.log('PASS: real TEST owner/admin authenticated, own customer profile passed RLS, admin proof RPC authorization passed, and checkout idempotency assertions passed.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error('REAL_TEST_CUSTOMER_AUTH_FAILURE:', error && error.stack ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

      - name: Stop local site
        if: always()
        run: |
          if [ -f /tmp/ils-http-auth.pid ]; then kill "$(cat /tmp/ils-http-auth.pid)" || true; fi
