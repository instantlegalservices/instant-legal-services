name: Test Production Sitemap Composer E2E

on:
  workflow_dispatch:
  push:
    branches:
      - v9-final-test
    paths:
      - "scripts/sitemap-composer-writer.js"
      - "scripts/sitemap-composer.js"
      - "scripts/location-registry-feed.js"
      - "scripts/location-sitemap.js"
      - ".github/workflows/test-production-sitemap-composer-e2e.yml"

permissions:
  contents: read

jobs:
  production-sitemap-composer-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TEST branch only
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Node.js version
        run: node --version

      - name: Run real Registry + Composer Writer E2E
        env:
          LOCATION_REGISTRY_SUPABASE_URL: ${{ secrets.LOCATION_REGISTRY_SUPABASE_URL }}
          LOCATION_REGISTRY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOCATION_REGISTRY_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sitemap-composer-writer.js

      - name: Verify generated sitemap
        run: |
          test -s sitemap.xml
          node -e "const fs=require('fs'); const xml=fs.readFileSync('sitemap.xml','utf8'); if(!xml.includes('<urlset') || !xml.includes('https://instantlegalservices.in/')) process.exit(1); console.log('GENERATED_SITEMAP_BASIC_VALIDATION=PASS')"

      - name: Show TEST-only working-tree change
        run: |
          git status --short
          git diff --stat -- sitemap.xml
          echo "NO_COMMIT_OR_PUSH=ENFORCED_BY_WORKFLOW"
