name: Test Location Migration Sitemap Integration

on:
  workflow_dispatch:

  push:
    branches:
      - v9-final-test
    paths:
      - "scripts/location-registry-feed.js"
      - "scripts/location-sitemap.js"
      - "scripts/location-migration.js"
      - "scripts/sitemap-composer.js"
      - "scripts/test-location-migration-sitemap-integration.js"
      - ".github/workflows/test-location-migration-sitemap-integration.yml"

permissions:
  contents: read

jobs:
  test-location-migration-sitemap-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Node.js
        run: node --version

      - name: Run migration to sitemap integration test
        run: node scripts/test-location-migration-sitemap-integration.js
