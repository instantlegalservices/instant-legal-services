name: Test Location Registry LGD Migration

on:
  workflow_dispatch:
  push:
    branches:
      - v9-final-test
    paths:
      - "supabase/migrations/20260919090907_location_registry_seo_foundation.sql"
      - "supabase/migrations/20260921100000_location_registry_lgd_identity.sql"
      - "scripts/test-location-registry-lgd-migration.sql"
      - ".github/workflows/test-location-registry-lgd-migration.yml"

permissions:
  contents: read

jobs:
  migration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ils_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ils_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PGPASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration files
        run: |
          test -f supabase/migrations/20260919090907_location_registry_seo_foundation.sql
          test -f supabase/migrations/20260921100000_location_registry_lgd_identity.sql
          test -f scripts/test-location-registry-lgd-migration.sql

      - name: Apply base Registry schema
        run: |
          psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username=postgres \
            --dbname=ils_test \
            --file=supabase/migrations/20260919090907_location_registry_seo_foundation.sql

      - name: Apply LGD identity migration
        run: |
          psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username=postgres \
            --dbname=ils_test \
            --file=supabase/migrations/20260921100000_location_registry_lgd_identity.sql

      - name: Verify migration
        run: |
          psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username=postgres \
            --dbname=ils_test \
            --file=scripts/test-location-registry-lgd-migration.sql
