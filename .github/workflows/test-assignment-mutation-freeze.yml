name: Test assignment mutation freeze guard

on:
  pull_request:
    paths:
      - "supabase/test-only/20261123040000_assignment_mutation_channel_freeze_guard.sql"
      - "supabase/test-only/tests/assignment-mutation-freeze-fixture.sql"
      - "supabase/test-only/tests/assignment-mutation-freeze.test.sql"
      - "supabase/test-only/tests/assignment-mutation-freeze-concurrency.sh"
      - ".github/workflows/test-assignment-mutation-freeze.yml"
  push:
    branches:
      - "feat/assignment-mutation-freeze-guard-20261123"
    paths:
      - "supabase/test-only/20261123040000_assignment_mutation_channel_freeze_guard.sql"
      - "supabase/test-only/tests/assignment-mutation-freeze-fixture.sql"
      - "supabase/test-only/tests/assignment-mutation-freeze.test.sql"
      - "supabase/test-only/tests/assignment-mutation-freeze-concurrency.sh"
      - ".github/workflows/test-assignment-mutation-freeze.yml"

jobs:
  assignment-mutation-freeze:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ils_assignment_freeze
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ils_assignment_freeze"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres -d ils_assignment_freeze && exit 0
            sleep 2
          done
          exit 1
      - name: Create disposable TEST-catalog fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ils_assignment_freeze -v ON_ERROR_STOP=1 -f supabase/test-only/tests/assignment-mutation-freeze-fixture.sql
      - name: Apply TEST-only freeze guard migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ils_assignment_freeze -v ON_ERROR_STOP=1 -f supabase/test-only/20261123040000_assignment_mutation_channel_freeze_guard.sql
      - name: Run rollback-only freeze contract tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ils_assignment_freeze -v ON_ERROR_STOP=1 -f supabase/test-only/tests/assignment-mutation-freeze.test.sql
      - name: Run two-session freeze/mutation concurrency test
        run: |
          bash supabase/test-only/tests/assignment-mutation-freeze-concurrency.sh
