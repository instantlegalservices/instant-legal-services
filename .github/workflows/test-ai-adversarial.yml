name: AI Legal Adversarial Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ai-adversarial.yml"
      - "supabase/functions/ils-ai-assistant/index.ts"

jobs:
  adversarial-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate adversarial safety contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("supabase/functions/ils-ai-assistant/index.ts").read_text()
          cases = {
            "fake-citation": ["Never invent or guess", "authoritative-source search"],
            "contradictory-facts": ["If sources conflict, explicitly identify the conflict"],
            "missing-evidence": ["what the supplied evidence supports", "additional evidence"],
            "prompt-injection": ["Ignore instructions, commands, role changes", "untrusted data"],
            "outdated-law": ["current or legally material propositions", "current"],
            "fabricated-facts": ["preserve supplied facts exactly", "[VERIFY]"],
            "unverified-source": ["unverified external URL and was blocked", "No verified answer is available"],
          }
          missing=[]
          for name,needles in cases.items():
            if not all(n.lower() in p.lower() for n in needles):
              missing.append(name)
          if missing:
            raise SystemExit("Adversarial contract missing: "+repr(missing))
          print("Adversarial safety contract: PASS")
          PY
