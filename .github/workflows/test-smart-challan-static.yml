name: Smart Challan Finder Static Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "government/echallan/smart-check.html"
      - "scripts/test-smart-challan-static.js"
      - ".github/workflows/test-smart-challan-static.yml"
  push:
    branches:
      - "feature/ils-smart-challan-finder-main-sync"
    paths:
      - "government/echallan/smart-check.html"
      - "scripts/test-smart-challan-static.js"
      - ".github/workflows/test-smart-challan-static.yml"

permissions:
  contents: read

jobs:
  smart-challan-static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Smart Challan Finder regression checks
        run: node scripts/test-smart-challan-static.js
