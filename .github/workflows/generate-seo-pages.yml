name: Generate Dynamic SEO Pages

on:
  workflow_dispatch:

  schedule:
    - cron: "17 18 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/generate-seo-pages.js"
      - "scripts/sitemap-composer.js"
      - "scripts/sitemap-composer-writer.js"
      - ".github/workflows/generate-seo-pages.yml"
      - "supabase/migrations/**"

permissions:
  contents: write

jobs:
  generate-seo-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate SEO pages
        env:
          ADVOCATES_API_URL: ${{ secrets.ADVOCATES_API_URL }}
          ADVOCATES_API_KEY: ${{ secrets.ADVOCATES_API_KEY }}
          PROFESSIONALS_API_URL: ${{ secrets.PROFESSIONALS_API_URL }}
          PROFESSIONALS_API_KEY: ${{ secrets.PROFESSIONALS_API_KEY }}
        run: node scripts/generate-seo-pages.js

      - name: Compose sitemap with generated professional routes
        env:
          LOCATION_REGISTRY_SUPABASE_URL: ${{ secrets.LOCATION_REGISTRY_SUPABASE_URL }}
          LOCATION_REGISTRY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOCATION_REGISTRY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { writeComposedSitemap } = require("./scripts/sitemap-composer-writer");

          const root = path.join(process.cwd(), "professional");
          const additionalUrls = [];

          for (const type of ["ca", "cs"]) {
            const typeDir = path.join(root, type);
            if (!fs.existsSync(typeDir)) continue;

            for (const entry of fs.readdirSync(typeDir, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;

              const indexPath = path.join(typeDir, entry.name, "index.html");
              if (!fs.existsSync(indexPath)) continue;

              additionalUrls.push(
                `https://instantlegalservices.in/professional/${type}/${entry.name}/`
              );
            }
          }

          additionalUrls.sort();

          console.log(`Professional sitemap URLs: ${additionalUrls.length}`);

          writeComposedSitemap({ additionalUrls })
            .then(result => {
              console.log(`Sitemap composition PASS: ${result.finalCount} URLs`);
            })
            .catch(error => {
              console.error(error);
              process.exit(1);
            });
          NODE

      - name: Commit generated SEO pages and sitemap
        run: |
          git config user.name "Instant Legal Services SEO Bot"
          git config user.email "seo-bot@instantlegalservices.in"

          git add .

          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
          else
            git commit -m "Auto-generate dynamic SEO pages"
            git push
          fi
