name: Generate Dynamic SEO Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-seo-pages.js"
      - "scripts/sitemap-composer.js"
      - "scripts/sitemap-composer-writer.js"
      - ".github/workflows/generate-seo-pages.yml"
      - "supabase/migrations/**"

permissions:
  contents: write

jobs:
  generate-seo-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate existing SEO pages
        env:
          ADVOCATES_API_URL: ${{ secrets.ADVOCATES_API_URL }}
          ADVOCATES_API_KEY: ${{ secrets.ADVOCATES_API_KEY }}
        run: node scripts/generate-seo-pages.js
      - name: Commit generated SEO pages
        run: |
          git config user.name "Instant Legal Services SEO Bot"
          git config user.email "seo-bot@instantlegalservices.in"
          git add .
          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
          else
            git commit -m "Auto-generate dynamic SEO pages"
            git push
          fi
