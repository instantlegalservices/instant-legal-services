name: Universal Intake CRM Linkage Migration Test

on:
  pull_request:
    paths:
      - "assistance.html"
      - "supabase/migrations/20261124193000_link_universal_intake_to_existing_crm.sql"
      - "scripts/test-business-compliance-postgres.sql"
      - ".github/workflows/test-universal-intake-linkage.yml"
  push:
    paths:
      - "assistance.html"
      - "supabase/migrations/20261124193000_link_universal_intake_to_existing_crm.sql"
      - "scripts/test-business-compliance-postgres.sql"
      - ".github/workflows/test-universal-intake-linkage.yml"

jobs:
  universal-intake-linkage:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ils_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ils_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Execute CRM security and universal-intake linkage migrations on disposable PostgreSQL 16
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d ils_test -v ON_ERROR_STOP=1 -f scripts/test-business-compliance-postgres.sql
