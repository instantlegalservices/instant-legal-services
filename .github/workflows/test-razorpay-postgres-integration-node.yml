name: Razorpay PostgreSQL Integration
on:
  pull_request:
    paths:
      - "supabase/functions/razorpay-payments/index.ts"
      - "supabase/functions/razorpay-webhook/index.ts"
      - "supabase/migrations/20261118191500_atomic_razorpay_payment_finalization.sql"
      - "scripts/test-razorpay-postgres-integration-node.js"
      - ".github/workflows/test-razorpay-postgres-integration-node.yml"
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: razorpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d razorpay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PostgreSQL test driver
        run: npm install --no-save pg
      - name: Run migration and concurrency integration checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: razorpay_test
        run: node scripts/test-razorpay-postgres-integration-node.js
