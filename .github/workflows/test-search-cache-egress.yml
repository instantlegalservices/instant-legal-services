name: Search Debounce and Homepage Cache E2E

on:
  pull_request:
    paths:
      - "judgments.html"
      - "advocates.html"
      - "assets/pwa.js"
      - "scripts/test-search-cache-egress.js"
      - ".github/workflows/test-search-cache-egress.yml"
  workflow_dispatch:

jobs:
  search-cache-egress:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ils-http.log 2>&1 &
          echo $! > /tmp/ils-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/judgments.html > /dev/null
      - name: Run debounce and cache browser regressions
        run: node scripts/test-search-cache-egress.js
