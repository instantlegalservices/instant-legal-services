name: Test Location Migration

on:
  workflow_dispatch:

  push:
    branches:
      - v9-final-test
    paths:
      - "scripts/location-migration.js"
      - "scripts/test-location-migration.js"
      - ".github/workflows/test-location-migration.yml"

permissions:
  contents: read

jobs:
  test-location-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run location migration tests
        run: node scripts/test-location-migration.js
