name: UPI Payment Proof Security
on:
  pull_request:
    paths:
      - "supabase/migrations/20261118190000_harden_upi_payment_proof_flow.sql"
      - "scripts/test-upi-payment-proof-security.js"
      - ".github/workflows/test-upi-payment-proof-security.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ils_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ils_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate UPI payment proof security contract
        run: node scripts/test-upi-payment-proof-security.js
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Execute UPI proof migration and runtime tests on PostgreSQL 16
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d ils_test -v ON_ERROR_STOP=1 -f scripts/test-upi-payment-proof-postgres.sql
