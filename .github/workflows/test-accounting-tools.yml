name: Accounting Tools UI E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "tools.html"
      - "assets/ils-tools.js"
      - "assets/ils-tools-catalog.js"
      - "assets/ils-accounting-advanced.js"
      - "assets/ils.css"
      - ".github/workflows/test-accounting-tools.yml"

jobs:
  accounting-tools-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ils-http.log 2>&1 &
          echo $! > /tmp/ils-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/tools.html > /dev/null

      - name: Run accounting UI regression
        timeout-minutes: 12
        env:
          BASE_URL: http://127.0.0.1:4173/tools.html
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const vm = require('node:vm');
          const fs = require('node:fs');

          (async () => {
            let browser;
            let browserWatchdog;
            const scriptTrace = { started: [], completed: [] };
            const stage = name => console.log('E2E_STAGE: ' + name);
            try {
            // Isolate the authoritative catalog from browser/CDN loading.
            const catalogSource = await (await fetch('http://127.0.0.1:4173/assets/ils-tools-catalog.js')).text();
            const catalogSandbox = { window: {} };
            vm.runInNewContext(catalogSource, catalogSandbox, { timeout: 2000, filename: 'ils-tools-catalog.js' });
            const isolatedCatalog = catalogSandbox.window.ILS_TOOL_CATALOG;
            if (!Array.isArray(isolatedCatalog) || isolatedCatalog.length !== 208) {
              throw new Error('Catalog isolated preflight failed: ' + (Array.isArray(isolatedCatalog) ? isolatedCatalog.length : typeof isolatedCatalog));
            }
            console.log('CATALOG_PREFLIGHT_PASS: 208 tools; isolated script executed within 2s.');

            // Start the watchdog before browser launch/context creation too:
            // those Playwright startup calls can also stall before a Page exists.
            browserWatchdog = setTimeout(() => {
              console.error('BROWSER_WATCHDOG_TIMEOUT: 120s', JSON.stringify(scriptTrace));
              try { browser?.close().catch(error => console.error('BROWSER_WATCHDOG_CLOSE_FAILURE:', error.message)); } catch (error) {
                console.error('BROWSER_WATCHDOG_CLOSE_FAILURE:', error.message);
              }
              process.exit(124);
            }, 120000);
            browserWatchdog.unref();
            stage('launch chromium');
            browser = await chromium.launch({ headless: true });
            stage('create browser context');
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, serviceWorkers: 'block', reducedMotion: 'reduce' });
            stage('create browser page');
            const page = await context.newPage();
            await page.addInitScript(() => {
              const originalAdd = EventTarget.prototype.addEventListener;
              EventTarget.prototype.addEventListener = function(type, listener, options) {
                if (type !== 'DOMContentLoaded' || typeof listener !== 'function') {
                  return originalAdd.call(this, type, listener, options);
                }
                const label = String(listener).replace(/\\s+/g, ' ').slice(0, 110);
                const wrapped = function(event) {
                  console.log('DCL_HANDLER_STARTED:' + label);
                  try {
                    const result = listener.call(this, event);
                    console.log('DCL_HANDLER_COMPLETED:' + label);
                    return result;
                  } catch (error) {
                    console.error('DCL_HANDLER_ERROR:' + label + ' :: ' + (error?.stack || error));
                    throw error;
                  }
                };
                return originalAdd.call(this, type, wrapped, options);
              };
            });
            page.setDefaultTimeout(10000);
            page.setDefaultNavigationTimeout(20000);

            const failures = [];
            page.on('request', request => console.log('BROWSER_REQUEST:', request.method(), request.url()));
            page.on('requestfinished', request => console.log('BROWSER_REQUEST_FINISHED:', request.url()));
            page.on('requestfailed', request => {
              const message = 'requestfailed: ' + request.url() + ' :: ' + (request.failure()?.errorText || 'unknown');
              failures.push(message);
              console.error('BROWSER_REQUEST_FAILURE:', message);
            });
            page.on('response', response => {
              console.log('BROWSER_RESPONSE:', response.status(), response.url());
              if (response.status() >= 400) console.error('BROWSER_HTTP_ERROR:', response.status(), response.url());
            });
            page.on('domcontentloaded', () => console.log('BROWSER_DOMCONTENTLOADED'));
            page.on('domcontentloaded', () => console.log('BROWSER_READY_STATE_AT_DOMCONTENTLOADED:', page.url()));
            page.on('load', () => console.log('BROWSER_READY_STATE_AT_LOAD:', page.url()));
            page.on('load', () => console.log('BROWSER_LOAD'));
            page.on('framenavigated', frame => console.log('BROWSER_FRAME_NAVIGATED:', frame.url()));
            page.on('pageerror', e => {
              failures.push('pageerror: ' + e.message);
              console.error('BROWSER_PAGE_ERROR:', e.stack || e.message);
            });
            page.on('console', m => {
              const message = m.text();
              if (message.startsWith('SCRIPT_BODY_STARTED:')) scriptTrace.started.push(message.slice(19));
              if (message.startsWith('SCRIPT_BODY_COMPLETED:')) scriptTrace.completed.push(message.slice(22));
              console.log('BROWSER_CONSOLE_' + m.type().toUpperCase() + ':', message);
              if (m.type() === 'error' && !message.includes('ILS Service Worker Error')) failures.push('console: ' + message);
            });

            const waitForCatalog = async stageName => {
              stage(stageName);
              try {
                await page.waitForFunction(() => Array.isArray(window.ILS_TOOL_CATALOG), null, { timeout: 20000 });
              } catch (error) {
                console.error('CATALOG_READINESS_TIMEOUT:', error.message);
                throw error;
              }
            };
            // Instrument the actual JavaScript response bodies in this test only.
            await page.route('**/assets/*.js*', async route => {
              const url = new URL(route.request().url());
              const script = url.pathname.split('/').pop();
              const tracked = ['ils-core.js','ils-tools-catalog.js','ils-tools.js','ils-tools-i18n.js','ils-accounting-advanced.js','pwa.js','ils-payments.js'];
              // Only proxy scripts whose bodies need instrumentation. Let
              // dynamically loaded, untracked scripts use the normal browser
              // request path so this test cannot stall their load lifecycle.
              if (!tracked.includes(script)) {
                await route.continue();
                return;
              }
              const response = await route.fetch({ timeout: 10000 });
              if (response.status() >= 400) {
                await route.fulfill({ response });
                return;
              }
              const source = await response.text();
              const marker = 'console.log("SCRIPT_BODY_STARTED:' + script + '");\n';
              const completed = '\n;console.log("SCRIPT_BODY_COMPLETED:' + script + '");';
              await route.fulfill({ response, body: marker + source + completed });
            });
            stage('open tools page');
            await page.goto(process.env.BASE_URL, { waitUntil: 'commit' });
            await waitForCatalog('wait for catalog after initial navigation');
            // All deferred application scripts must have executed before reload.
            // The dynamically injected global language script and background data
            // fetches are not prerequisites for the accounting UI regression.
            const requiredScriptBodies = [
              'ils-payments.js','ils-core.js','ils-tools-catalog.js','ils-tools.js',
              'ils-tools-i18n.js','ils-accounting-advanced.js','pwa.js'
            ];
            const missingScriptBodies = requiredScriptBodies.filter(script => !scriptTrace.completed.includes(script));
            if (missingScriptBodies.length) {
              throw new Error('Tracked application scripts did not complete before reload: ' + missingScriptBodies.join(', '));
            }
            stage('all tracked application scripts completed; reload tools page');
            await page.reload({ waitUntil: 'commit' });
            await waitForCatalog('wait for catalog after reload');
            const catalogProbe = await page.evaluate(() => ({
              hasCatalog: Array.isArray(window.ILS_TOOL_CATALOG),
              accounting: Array.isArray(window.ILS_TOOL_CATALOG)
                ? window.ILS_TOOL_CATALOG.find(x => x.slug === 'accounting-computation') || null
                : null
            }));
            if (!catalogProbe.hasCatalog) {
              throw new Error('Tool catalog did not load: ' + JSON.stringify(catalogProbe));
            }

            // Paid-tier mapping regression: verify the live frontend maps the
            // ₹85/₹125 report buttons to the exact production service slugs.
            // This is a no-payment contract test; it does not call Razorpay/UPI.
            // Establish the same tool workspace used by the real paid-tier UI before invoking the order helper.
            // This is test-context only; production code is unchanged.
            await page.evaluate(() => {
              window.__ilsOriginalReady = window.ILS.ready;
            });
            await page.evaluate(() => {
              window.ILS.ready = () => ({
                auth: { getUser: async () => ({ data: { user: { id: 'e2e-paid-tier-user' } } }) },
                rpc: async (name, args) => {
                  if (name !== 'ils_create_service_order') throw new Error('Unexpected paid-tier RPC: ' + name);
                  const expected = [
                    { slug: 'professional-report-guided', amount: 85 },
                    { slug: 'professional-report-professional', amount: 125 }
                  ].find(x => x.slug === args.p_service_slug);
                  if (!expected) throw new Error('Wrong paid-tier service slug: ' + args.p_service_slug);
                  window.__e2eTierResults = window.__e2eTierResults || [];
                  window.__e2eTierResults.push({ slug: args.p_service_slug, amount: expected.amount });
                  return { data: { ok: true, order_id: 'e2e-' + expected.slug, order_number: 'ILS-E2E-' + expected.amount, amount: expected.amount, service_name: 'Paid Tier' }, error: null };
                }
              });
            });
            stage('verify paid-tier mapping');
            const paidTierChecks = [
              { slug: 'professional-report-guided', amount: 85 },
              { slug: 'professional-report-professional', amount: 125 }
            ];
            await page.locator('.tool-card .tool-open[data-tool="profit-loss-tool"]').click();
            await page.locator('#toolStatus').waitFor({ state: 'attached' });
            try {
              for (const tier of paidTierChecks) {
                const statusBox = page.locator('#toolStatus');
                await page.evaluate(() => {
                  const el = document.getElementById('toolStatus');
                  if (el) { el.className = 'status'; el.textContent = ''; }
                });
                await page.evaluate(async ({ slug }) => {
                  await window.ILS_TOOLS.createOrder(slug, { e2e: true }, null, null, { forceQr: true });
                }, { slug: tier.slug });
                await statusBox.locator('#payNowBtn').waitFor({ state: 'visible' }).catch(() => {
                  throw new Error('Paid-tier payment button did not open for ' + tier.slug);
                });
              }
            } finally {
              await page.evaluate(() => { window.ILS.ready = window.__ilsOriginalReady; });
            }
            const tierResults = await page.evaluate(() => window.__e2eTierResults || []);
            if (JSON.stringify(tierResults) !== JSON.stringify(paidTierChecks)) {
              throw new Error('Paid-tier mapping regression: ' + JSON.stringify(tierResults));
            }
            if (catalogProbe.accounting) {
              throw new Error('Accounting Computation must remain a workflow capability, not a 209th catalog tool: ' + JSON.stringify(catalogProbe.accounting));
            }

            // Accounting tools are catalog entries, not a dedicated UI filter category.
            // Identify them by their authoritative tool slugs so the regression test
            // remains stable when the profession/category taxonomy changes.
            const expectedSlugs = [
              'balance-sheet-tool',
              'profit-loss-tool'
            ];

            const runtimeCount = await page.evaluate(() => Array.isArray(window.ILS_TOOL_CATALOG) ? window.ILS_TOOL_CATALOG.length : -1);
            if (runtimeCount !== 208) {
              throw new Error('Authoritative tool catalog count changed: ' + runtimeCount);
            }

            for (const slug of expectedSlugs) {
              if (await page.locator('.tool-card .tool-open[data-tool="' + slug + '"]').count() !== 1) {
                throw new Error('Missing accounting tool card: ' + slug);
              }
            }

            stage('open profit and loss accounting mode');
            await page.locator('.tool-card .tool-open[data-tool="profit-loss-tool"]').click();
            await page.locator('#plAccountingMode').click();
            const workspace = page.locator('#toolWorkspace');
            await workspace.waitFor({ state: 'visible' });

            const scrollY = await page.evaluate(() => window.scrollY);
            const workspaceTop = await workspace.evaluate(el => el.getBoundingClientRect().top);
            const workspaceBottom = await workspace.evaluate(el => el.getBoundingClientRect().bottom);
            const viewportHeight = await page.evaluate(() => window.innerHeight);
            if (!(workspaceBottom > 0 && workspaceTop < viewportHeight)) {
              throw new Error('Tool click did not bring workspace into viewport: top=' + workspaceTop + ', bottom=' + workspaceBottom + ', scrollY=' + scrollY);
            }

            await page.locator('#toolWorkspace #acRevenue').fill('100000');
            await page.locator('#toolWorkspace #acCost').fill('40000');
            await page.locator('#toolWorkspace #acOperating').fill('20000');
            await page.locator('#toolWorkspace #acOtherIncome').fill('5000');
            await page.locator('#toolWorkspace #acOtherExpense').fill('3000');
            await page.locator('#toolWorkspace #acMake').click();

            await page.waitForTimeout(200);

            const resultText = await page.locator('#toolWorkspace').innerText();
            for (const expected of ['Gross Profit', 'Operating Profit', 'Net Profit / (Loss)', '₹60,000.00', '₹40,000.00', '₹42,000.00']) {
              if (!resultText.includes(expected)) {
                throw new Error('Expected calculation output missing: ' + expected);
              }
            }

            for (const price of ['₹45', '₹85', '₹125']) {
              if (!resultText.includes(price)) {
                throw new Error('Expected paid export tier missing: ' + price);
              }
            }

            if (!resultText.includes('Print / Save as PDF')) {
              throw new Error('Paid PDF/print export option missing');
            }

            stage('verify accounting calculation and paid export tiers');
            // Verify accounting exports use the exact existing main-branch
            // order + Razorpay/QR fallback path. No real payment is made.
            await page.evaluate(() => {
              let proofSubmitted = false;

              const fakeSupabase = {
                auth: {
                  getUser: async () => ({
                    data: { user: { id: 'e2e-user' } }
                  })
                },
                rpc: async (name, args) => {
                  if (name === 'ils_create_service_order') {
                    if (args.p_service_slug !== 'accounting-print-basic') {
                      throw new Error('Wrong accounting service slug: ' + args.p_service_slug);
                    }
                    return {
                      data: {
                        ok: true,
                        order_id: 'e2e-accounting-order',
                        order_number: 'ILS-E2E-ACCOUNTING',
                        amount: 45,
                        service_name: 'Basic Report'
                      },
                      error: null
                    };
                  }

                  if (name === 'ils_submit_upi_payment_proof') {
                    if (args.p_order_id !== 'e2e-accounting-order') {
                      throw new Error('Proof submitted for wrong order');
                    }
                    if (Number(args.p_amount) !== 45) {
                      throw new Error('Proof amount did not match order');
                    }
                    if (args.p_upi_id !== '8445609837@axl') {
                      throw new Error('Unexpected UPI ID');
                    }
                    proofSubmitted = true;
                    window.__e2eProofSubmitted = true;
                    return {
                      data: {
                        ok: true,
                        proof_id: 'e2e-proof',
                        status: 'pending',
                        order_id: 'e2e-accounting-order',
                        order_number: 'ILS-E2E-ACCOUNTING'
                      },
                      error: null
                    };
                  }

                  if (name === 'ils_get_upi_proof_status') {
                    return {
                      data: {
                        ok: true,
                        order_id: 'e2e-accounting-order',
                        order_number: 'ILS-E2E-ACCOUNTING',
                        order_status: proofSubmitted ? 'paid' : 'pending',
                        proof_status: proofSubmitted ? 'verified' : null
                      },
                      error: null
                    };
                  }

                  throw new Error('Unexpected RPC: ' + name);
                },
                storage: {
                  from: bucket => ({
                    upload: async (path, file) => ({
                      data: { path },
                      error: null
                    }),
                    remove: async () => ({ data: null, error: null })
                  })
                },
                functions: {
                  invoke: async (name) => {
                    throw new Error('QR mode should not call Razorpay: ' + name);
                  }
                }
              };

              window.__e2eProofSubmitted = false;
              window.__ilsOriginalReady = window.ILS.ready;
              window.ILS.ready = () => fakeSupabase;
            });

            stage('verify QR proof and report unlock');
            const exportButton = page.locator('.tool-export-buy[data-export-service="accounting-print-basic"]').first();
            await exportButton.click();

            const payNow = page.locator('#payNowBtn');
            await payNow.waitFor({ state: 'visible', timeout: 2000 });
            await payNow.click();

            const upiButton = page.locator('#upiPaidBtn');
            await upiButton.waitFor({ state: 'visible', timeout: 2000 });
            if (!await page.locator('img[alt="Instant Legal Services UPI QR"]').isVisible()) {
              throw new Error('Existing UPI QR fallback was not shown');
            }

            const proofPanel = page.locator('#upiProofPanel');
            if (!await proofPanel.isVisible()) {
              throw new Error('QR payment proof form was not shown');
            }

            await page.locator('#upiTransactionRef').fill('123456789012');
            await page.locator('#upiPayeeName').fill('Instant Legal Services');
            await page.locator('#upiPaymentScreenshot').setInputFiles({
              name: 'payment-success.png',
              mimeType: 'image/png',
              buffer: Buffer.from('fake-e2e-payment-screenshot')
            });

            await upiButton.click();
            await page.waitForTimeout(500);

            const proofSubmitted = await page.evaluate(() => window.__e2eProofSubmitted === true);
            if (!proofSubmitted) {
              throw new Error('Payment proof submission RPC was not called');
            }

            const exportJobId = await exportButton.getAttribute('data-export-job');
            if (!exportJobId) {
              throw new Error('Accounting export job id is missing');
            }

            // The unlock target is the job-specific ready box inside the same
            // accounting notice. Do not infer it from button parent depth.
            const readyBox = page.locator('#' + exportJobId + '-ready');
            await readyBox.waitFor({ state: 'visible', timeout: 2000 });

            if (!await readyBox.getByText('Report unlocked.', { exact: false }).count()) {
              throw new Error('Verified QR order did not unlock the accounting report');
            }

            const printButton = readyBox.getByRole('button', { name: 'Print / Save as PDF' });
            if (await printButton.count() !== 1) {
              throw new Error('Verified QR proof did not unlock the PDF/print control');
            }
            if (!await printButton.isVisible()) {
              throw new Error('Unlocked PDF/print control is not visible'); 
            }

            stage('verify advanced accounting tools');
            // Advanced accounting layer regression: new tools and dedicated workflows.
            for (const slug of ['bank-reconciliation','trial-balance','inventory-valuation','fixed-asset-register','payroll-compliance-estimator']) {
              if (await page.locator('.tool-card .tool-open[data-tool="' + slug + '"]').count() !== 1) {
                throw new Error('Missing advanced accounting tool: ' + slug);
              }
            }

            await page.locator('.tool-card .tool-open[data-tool="trial-balance"]').click();
            await page.locator('#tbRows').fill('Cash | 100000 | 0\nSales | 0 | 80000\nCapital | 0 | 50000\nRent | 30000 | 0');
            await page.locator('#tbRun').click();
            const tbText = await page.locator('#toolWorkspace').innerText();
            for (const expected of ['Trial Balance','₹80,000.00','Balanced']) {
              if (!tbText.includes(expected)) throw new Error('Trial balance output missing: ' + expected);
            }

            await page.locator('.tool-card .tool-open[data-tool="bank-reconciliation"]').click();
            await page.locator('#brBook').fill('100000');
            await page.locator('#brBank').fill('105000');
            await page.locator('#brCredits').fill('Interest | 1000');
            await page.locator('#brDebits').fill('Charges | 500');
            await page.locator('#brRun').click();
            const brText = await page.locator('#toolWorkspace').innerText();
            if (!brText.includes('₹1,00,500.00')) throw new Error('Bank reconciliation adjusted balance missing');

            await page.evaluate(() => { if (window.__ilsOriginalReady) window.ILS.ready = window.__ilsOriginalReady; });

            if (failures.length) {
              throw new Error(failures.join('\n'));
            }

            console.log('PASS: Accounting filter, 3 cards, auto-scroll, calculation, and paid PDF tiers verified.');
            } catch (error) {
              console.error('ACCOUNTING_E2E_FAILURE:', error && error.stack ? error.stack : error);
              process.exitCode = 1;
            } finally {
              if (browserWatchdog) clearTimeout(browserWatchdog);
              if (browser) await browser.close().catch(error => console.error('BROWSER_CLOSE_FAILURE:', error.message));
            }
          })();
          NODE

      - name: Stop local site
        if: always()
        run: |
          if [ -f /tmp/ils-http.pid ]; then kill "$(cat /tmp/ils-http.pid)" || true; fi
