name: Accounting Tools UI E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "tools.html"
      - "assets/ils-tools.js"
      - "assets/ils-tools-catalog.js"
      - "assets/ils.css"
      - ".github/workflows/test-accounting-tools.yml"

jobs:
  accounting-tools-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ils-http.log 2>&1 &
          echo $! > /tmp/ils-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/tools.html > /dev/null

      - name: Run accounting UI regression
        env:
          BASE_URL: http://127.0.0.1:4173/tools.html
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, serviceWorkers: 'block' });
            const page = await context.newPage();

            const failures = [];
            page.on('pageerror', e => failures.push('pageerror: ' + e.message));
            page.on('console', m => {
              if (m.type() === 'error') failures.push('console: ' + m.text());
            });

            await page.goto(process.env.BASE_URL, { waitUntil: 'networkidle' });
            await page.reload({ waitUntil: 'networkidle' });
            const catalogProbe = await page.evaluate(() => ({
              hasCatalog: Array.isArray(window.ILS_TOOL_CATALOG),
              accounting: Array.isArray(window.ILS_TOOL_CATALOG)
                ? window.ILS_TOOL_CATALOG.find(x => x.slug === 'accounting-computation') || null
                : null
            }));
            if (!catalogProbe.hasCatalog) {
              throw new Error('Tool catalog did not load: ' + JSON.stringify(catalogProbe));
            }
            if (catalogProbe.accounting) {
              throw new Error('Accounting Computation must remain a workflow capability, not a 209th catalog tool: ' + JSON.stringify(catalogProbe.accounting));
            }

            // Accounting tools are catalog entries, not a dedicated UI filter category.
            // Identify them by their authoritative tool slugs so the regression test
            // remains stable when the profession/category taxonomy changes.
            const expectedSlugs = [
              'balance-sheet-tool',
              'profit-loss-tool'
            ];

            if (window.ILS_TOOL_CATALOG.length !== 208) {
              throw new Error('Authoritative tool catalog count changed: ' + window.ILS_TOOL_CATALOG.length);
            }

            for (const slug of expectedSlugs) {
              if (await page.locator('.tool-card .tool-open[data-tool="' + slug + '"]').count() !== 1) {
                throw new Error('Missing accounting tool card: ' + slug);
              }
            }

            await page.locator('.tool-card .tool-open[data-tool="profit-loss-tool"]').click();
            await page.locator('#plAccountingMode').click();
            await page.waitForTimeout(500);

            const workspaceVisible = await page.locator('#toolWorkspace').isVisible();
            if (!workspaceVisible) throw new Error('Accounting workspace is not visible');

            const scrollY = await page.evaluate(() => window.scrollY);
            const workspaceTop = await page.locator('#toolWorkspace').evaluate(el => el.getBoundingClientRect().top);
            if (Math.abs(workspaceTop) > 180) {
              throw new Error('Tool click did not auto-scroll workspace into view: top=' + workspaceTop + ', scrollY=' + scrollY);
            }

            await page.locator('#toolWorkspace #acRevenue').fill('100000');
            await page.locator('#toolWorkspace #acCost').fill('40000');
            await page.locator('#toolWorkspace #acOperating').fill('20000');
            await page.locator('#toolWorkspace #acOtherIncome').fill('5000');
            await page.locator('#toolWorkspace #acOtherExpense').fill('3000');
            await page.locator('#toolWorkspace #acMake').click();

            await page.waitForTimeout(200);

            const resultText = await page.locator('#toolWorkspace').innerText();
            for (const expected of ['Gross Profit', 'Operating Profit', 'Net Profit / (Loss)', '₹60,000.00', '₹40,000.00', '₹42,000.00']) {
              if (!resultText.includes(expected)) {
                throw new Error('Expected calculation output missing: ' + expected);
              }
            }

            for (const price of ['₹45', '₹85', '₹125']) {
              if (!resultText.includes(price)) {
                throw new Error('Expected paid export tier missing: ' + price);
              }
            }

            if (!resultText.includes('Print / Save as PDF')) {
              throw new Error('Paid PDF/print export option missing');
            }

            // Verify accounting exports use the exact existing main-branch
            // order + Razorpay/QR fallback path. No real payment is made.
            await page.evaluate(() => {
              let proofSubmitted = false;

              const fakeSupabase = {
                auth: {
                  getUser: async () => ({
                    data: { user: { id: 'e2e-user' } }
                  })
                },
                rpc: async (name, args) => {
                  if (name === 'ils_create_service_order') {
                    if (args.p_service_slug !== 'accounting-print-basic') {
                      throw new Error('Wrong accounting service slug: ' + args.p_service_slug);
                    }
                    return {
                      data: {
                        ok: true,
                        order_id: 'e2e-accounting-order',
                        order_number: 'ILS-E2E-ACCOUNTING',
                        amount: 45,
                        service_name: 'Basic Report'
                      },
                      error: null
                    };
                  }

                  if (name === 'ils_submit_upi_payment_proof') {
                    if (args.p_order_id !== 'e2e-accounting-order') {
                      throw new Error('Proof submitted for wrong order');
                    }
                    if (Number(args.p_amount) !== 45) {
                      throw new Error('Proof amount did not match order');
                    }
                    if (args.p_upi_id !== '8445609837@axl') {
                      throw new Error('Unexpected UPI ID');
                    }
                    proofSubmitted = true;
                    window.__e2eProofSubmitted = true;
                    return {
                      data: {
                        ok: true,
                        proof_id: 'e2e-proof',
                        status: 'pending',
                        order_id: 'e2e-accounting-order',
                        order_number: 'ILS-E2E-ACCOUNTING'
                      },
                      error: null
                    };
                  }

                  if (name === 'ils_get_upi_proof_status') {
                    return {
                      data: {
                        ok: true,
                        order_id: 'e2e-accounting-order',
                        order_number: 'ILS-E2E-ACCOUNTING',
                        order_status: proofSubmitted ? 'paid' : 'pending',
                        proof_status: proofSubmitted ? 'verified' : null
                      },
                      error: null
                    };
                  }

                  throw new Error('Unexpected RPC: ' + name);
                },
                storage: {
                  from: bucket => ({
                    upload: async (path, file) => ({
                      data: { path },
                      error: null
                    }),
                    remove: async () => ({ data: null, error: null })
                  })
                },
                functions: {
                  invoke: async (name) => {
                    throw new Error('QR mode should not call Razorpay: ' + name);
                  }
                }
              };

              window.__e2eProofSubmitted = false;
              window.ILS.ready = () => fakeSupabase;
            });

            const exportButton = page.locator('.tool-export-buy[data-export-service="accounting-print-basic"]').first();
            await exportButton.click();

            const payNow = page.locator('#payNowBtn');
            await payNow.waitFor({ state: 'visible', timeout: 2000 });
            await payNow.click();

            const upiButton = page.locator('#upiPaidBtn');
            await upiButton.waitFor({ state: 'visible', timeout: 2000 });
            if (!await page.locator('img[alt="Instant Legal Services UPI QR"]').isVisible()) {
              throw new Error('Existing UPI QR fallback was not shown');
            }

            const proofPanel = page.locator('#upiProofPanel');
            if (!await proofPanel.isVisible()) {
              throw new Error('QR payment proof form was not shown');
            }

            await page.locator('#upiTransactionRef').fill('123456789012');
            await page.locator('#upiPayeeName').fill('Instant Legal Services');
            await page.locator('#upiPaymentScreenshot').setInputFiles({
              name: 'payment-success.png',
              mimeType: 'image/png',
              buffer: Buffer.from('fake-e2e-payment-screenshot')
            });

            await upiButton.click();
            await page.waitForTimeout(500);

            const proofSubmitted = await page.evaluate(() => window.__e2eProofSubmitted === true);
            if (!proofSubmitted) {
              throw new Error('Payment proof submission RPC was not called');
            }

            const exportJobId = await exportButton.getAttribute('data-export-job');
            if (!exportJobId) {
              throw new Error('Accounting export job id is missing');
            }

            // The unlock target is the job-specific ready box inside the same
            // accounting notice. Do not infer it from button parent depth.
            const readyBox = page.locator('#' + exportJobId + '-ready');
            await readyBox.waitFor({ state: 'visible', timeout: 2000 });

            if (!await readyBox.getByText('Report unlocked.', { exact: false }).count()) {
              throw new Error('Verified QR order did not unlock the accounting report');
            }

            const printButton = readyBox.getByRole('button', { name: 'Print / Save as PDF' });
            if (await printButton.count() !== 1) {
              throw new Error('Verified QR proof did not unlock the PDF/print control');
            }
            if (!await printButton.isVisible()) {
              throw new Error('Unlocked PDF/print control is not visible'); 
            }

            if (failures.length) {
              throw new Error(failures.join('\n'));
            }

            console.log('PASS: Accounting filter, 3 cards, auto-scroll, calculation, and paid PDF tiers verified.');
            await browser.close();
          })();
          NODE

      - name: Stop local site
        if: always()
        run: |
          if [ -f /tmp/ils-http.pid ]; then kill "$(cat /tmp/ils-http.pid)" || true; fi
