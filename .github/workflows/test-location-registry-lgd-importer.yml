name: Test Location Registry LGD Importer

on:
  workflow_dispatch:

  push:
    branches:
      - v9-final-test
    paths:
      - "scripts/location-registry-lgd-importer.js"
      - "scripts/test-location-registry-lgd-importer.js"
      - ".github/workflows/test-location-registry-lgd-importer.yml"

permissions:
  contents: read

jobs:
  lgd-importer-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run LGD importer core verification
        run: node scripts/test-location-registry-lgd-importer.js
