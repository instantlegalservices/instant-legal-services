name: Validate Professional SEO Sitemap Integration

on:
  workflow_dispatch:
  push:
    branches:
      - seo-professional-indexability-fix
    paths:
      - "scripts/generate-seo-pages.js"
      - "scripts/sitemap-composer.js"
      - "scripts/sitemap-composer-writer.js"
      - "scripts/sync-professional-sitemap.js"
      - ".github/workflows/validate-professional-seo-sitemap.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated SEO branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Node.js
        run: node --version
      - name: Verify SEO generator syntax
        run: node --check scripts/generate-seo-pages.js

      - name: Verify Advocate generation without professional feed
        env:
          ADVOCATES_API_URL: "http://127.0.0.1:8788/advocates"
          ADVOCATES_API_KEY: "ci-advocate-key"
        run: |
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$TMP_DIR/scripts"
          cp scripts/generate-seo-pages.js "$TMP_DIR/scripts/generate-seo-pages.js"
          node -e 'const http=require("http"); const data=JSON.stringify([{id:"ci-advocate-001",advocate_name:"CI Test Advocate",practice_state:"Uttar Pradesh",district_court:"Bareilly | District and Sessions Court",primary_practice_area:"Criminal Law",years_of_practice:5,public_profile:true,verification_status:"Approved"}]); http.createServer((req,res)=>{res.writeHead(200,{"Content-Type":"application/json"});res.end(data)}).listen(8788,"127.0.0.1")' &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -rf "$TMP_DIR"' EXIT
          sleep 1
          (cd "$TMP_DIR" && node scripts/generate-seo-pages.js)
          test -f "$TMP_DIR/advocate/ci-test-advocate/index.html"
          test -f "$TMP_DIR/state/uttar-pradesh/index.html"
          test -f "$TMP_DIR/district/bareilly/index.html"
          test -f "$TMP_DIR/court/district-and-sessions-court/index.html"
          test -f "$TMP_DIR/practice/criminal-law/index.html"
          grep -q "CI Test Advocate" "$TMP_DIR/advocate/ci-test-advocate/index.html"
          grep -q 'href="/district/bareilly/"' "$TMP_DIR/state/uttar-pradesh/index.html"
          grep -q 'href="/court/district-and-sessions-court/"' "$TMP_DIR/state/uttar-pradesh/index.html"
          grep -q 'href="/practice/criminal-law/"' "$TMP_DIR/state/uttar-pradesh/index.html"
          grep -q 'href="/state/uttar-pradesh/"' "$TMP_DIR/district/bareilly/index.html"
          grep -q 'href="/practice/criminal-law/"' "$TMP_DIR/district/bareilly/index.html"
          grep -q 'href="/state/uttar-pradesh/"' "$TMP_DIR/court/district-and-sessions-court/index.html"
          grep -q 'href="/district/bareilly/"' "$TMP_DIR/court/district-and-sessions-court/index.html"
          grep -q 'href="/state/uttar-pradesh/"' "$TMP_DIR/practice/criminal-law/index.html"
          grep -q 'href="/district/bareilly/"' "$TMP_DIR/practice/criminal-law/index.html"
          grep -q 'href="/court/district-and-sessions-court/"' "$TMP_DIR/practice/criminal-law/index.html"
          echo "ADVOCATE_GENERATION_WITHOUT_PROFESSIONAL_FEED=PASS"
          echo "CONTEXTUAL_LOCATION_GRAPH=PASS"

      - name: Generate professional pages in isolation
        env:
          PROFESSIONALS_ONLY: "1"
          PROFESSIONALS_API_URL: "http://127.0.0.1:8787/feed"
          PROFESSIONALS_API_KEY: "ci-test-key"
        run: |
          node -e 'const http=require("http"); const data=JSON.stringify([{id:"ci-test-ca-001",professional_type:"ca",full_name:"CI Test Chartered Accountant",state:"Uttar Pradesh",city:"Bareilly",specialization:"GST, Income Tax",years_of_experience:5,firm_or_organization:"CI Test Firm"},{id:"ci-test-cs-001",professional_type:"cs",full_name:"CI Test Company Secretary",state:"Uttar Pradesh",city:"Bareilly",specialization:"Corporate Compliance",years_of_experience:4,firm_or_organization:"CI Test Firm"}]); http.createServer((req,res)=>{res.writeHead(200,{"Content-Type":"application/json"});res.end(data)}).listen(8787,"127.0.0.1")' &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true; rm -rf professional/ca/ci-test-chartered-accountant professional/cs/ci-test-company-secretary" EXIT
          sleep 1
          node scripts/generate-seo-pages.js
          test -f professional/ca/ci-test-chartered-accountant/index.html
          test -f professional/cs/ci-test-company-secretary/index.html
          grep -q "CI Test Chartered Accountant" professional/ca/ci-test-chartered-accountant/index.html
          test -f professional/ca/index.html
          test -f professional/cs/index.html
          grep -q "CI Test Chartered Accountant" professional/ca/index.html
          grep -q "CI Test Company Secretary" professional/cs/index.html
          grep -q '/professional/ca/ci-test-chartered-accountant/' professional/ca/index.html
          grep -q '/professional/cs/ci-test-company-secretary/' professional/cs/index.html
          grep -q '/professional/ca/' professional/ca/ci-test-chartered-accountant/index.html
          test -f professional/ca/state/uttar-pradesh/index.html
          test -f professional/ca/city/bareilly/index.html
          test -f professional/ca/specialization/gst/index.html
          test -f professional/ca/specialization/income-tax/index.html
          test -f professional/cs/specialization/corporate-compliance/index.html
          grep -q '/professional/ca/state/uttar-pradesh/' professional/ca/ci-test-chartered-accountant/index.html
          grep -q '/professional/ca/city/bareilly/' professional/ca/ci-test-chartered-accountant/index.html
          grep -q '/professional/ca/specialization/gst/' professional/ca/ci-test-chartered-accountant/index.html
          grep -q '/professional/ca/ci-test-chartered-accountant/' professional/ca/state/uttar-pradesh/index.html
          grep -q '/professional/cs/ci-test-company-secretary/' professional/cs/specialization/corporate-compliance/index.html
          echo "PROFESSIONAL_LOCATION_SPECIALIZATION_GRAPH=PASS"
          echo "PROFESSIONAL_DIRECTORY_GRAPH=PASS"
          echo "PROFESSIONAL_PAGE_GENERATION=PASS"

      - name: Verify sitemap composer modules
        run: node -e "require('./scripts/sitemap-composer.js'); require('./scripts/sitemap-composer-writer.js'); console.log('SITEMAP_MODULES=PASS')"
      - name: Verify isolated professional sitemap synchronizer
        run: |
          node --check scripts/sync-professional-sitemap.js
          node -e "const m=require('./scripts/sync-professional-sitemap.js'); if(m.MANAGED_PREFIXES.length!==2) throw new Error('managed prefix count'); console.log('PROFESSIONAL_SITEMAP_SYNC_MODULE=PASS')"

      - name: Validate professional routes with existing sitemap composer
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { composeSitemap, validateComposedSitemap } = require("./scripts/sitemap-composer");
          const existing = fs.readFileSync("sitemap.xml", "utf8");
          const professionalUrls = [
            "https://instantlegalservices.in/professional/ca/example-ca/",
            "https://instantlegalservices.in/professional/cs/example-cs/"
          ];
          const result = composeSitemap(existing, [], [], professionalUrls, ["/professional/ca/", "/professional/cs/"]);
          validateComposedSitemap(result.xml);
          for (const url of professionalUrls) {
            if (!result.xml.includes("<loc>" + url + "</loc>")) {
              throw new Error("Missing professional URL: " + url);
            }
          }
          const staleProfessional = "https://instantlegalservices.in/professional/ca/stale-profile/";
          const staleInput = existing.replace(
            "</urlset>",
            "  <url>\\n    <loc>" + staleProfessional + "</loc>\\n  </url>\\n</urlset>"
          );
          const staleResult = composeSitemap(
            staleInput,
            [],
            [],
            professionalUrls,
            ["/professional/ca/", "/professional/cs/"]
          );
          if (staleResult.xml.includes("<loc>" + staleProfessional + "</loc>")) {
            throw new Error("Stale managed professional URL survived");
          }
          const existingLocCount = (existing.match(/<loc>/g) || []).length;
          const finalLocCount = (result.xml.match(/<loc>/g) || []).length;
          if (finalLocCount !== existingLocCount - 0 + professionalUrls.length) {
            throw new Error("Unexpected sitemap count: existing=" + existingLocCount + ", final=" + finalLocCount);
          }
          console.log("PROFESSIONAL_SITEMAP_COMPOSER=PASS");
          console.log("PROFESSIONAL_STALE_ROUTE_REMOVAL=PASS");
          console.log("Existing URLs: " + existingLocCount);
          console.log("Final URLs: " + finalLocCount);
          NODE
      - name: Verify sitemap was not written
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml was modified unexpectedly."
            exit 1
          fi
          echo "NO_SITEMAP_WRITE=PASS"
